<!DOCTYPE html>

<html lang="en">
  <head>
    <title>SWDC Calendar</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Southwest Washington Dance Center (SWDC) calendar and schedule viewer">
    <link rel="preload" as="image" fetchpriority="high" href="https://images.squarespace-cdn.com/content/v1/5fa31a9e206c8a69fd49cfda/1611602029932-VTFLL1ATNQGALUG35LPA/png.png?format=500w">
    <style>
      * {
        margin: 0;
        min-width: 0;
        min-height: 0;
        font-family: sans-serif;
        box-sizing: border-box;
        user-select: none;
      }
      :root {
        height: 100dvh;
        background-color: var(--bg-color-2);
        -webkit-tap-highlight-color: transparent;
        --bg-color-1: #232037;
        --bg-color-2: #1b1b1b;
        --font-size-0: 0.8cqw;
        --font-size-1: 1cqw;
        --font-size-2: 1.25cqw;
        --font-size-3: 1.5cqw;
        --font-size-4: 2cqw;
        --font-size-5: 3cqw;
        --logo-height: 20vh;
        --copy-height: 4vh;
      }
      body {
        height: 100%;
      }
      main {
        display: flex;
        width: 100%;
        height: 100%;
      }
      .icons {
        display: flex;
        position: absolute;
        right: 0;
      
        & svg {
          cursor: pointer;
          margin: 6px;
          width: 24px;
        }
      }
      .divider {
        position: absolute;
        z-index: 1;
        touch-action: none;
      }
      .alert-message {
        z-index: 2;
        color: white;
        border: 1px solid gray;
        background-color: var(--bg-color-2);
        position: fixed;
        top: 100%;
        left: 50%;
        padding: 4px 10px;
        border-radius: 6px;
        animation: slideIn 0.3s ease forwards;
        pointer-events: none;
        text-wrap: nowrap;
      }
      @keyframes slideIn {
        from {transform: translate(-50%)}
        to {transform: translate(-50%, -200%)}
      }
      #section-1 {
        position: relative;
        width: 42%;
        height: 100%;
        background-image: linear-gradient(to right, var(--bg-color-1), var(--bg-color-2));
      }
      #logo-section {
        position: relative;
        height: var(--logo-height);
        width: 100%;
      }
      #logo {
        position: absolute;
        padding: 10px;
        max-height: 100%;
        width: auto;
        inset: 0;
        place-self: center;
      }
      #display {
        position: relative;
        text-align: center;
        height: calc(100% - var(--logo-height) - 20px - var(--copy-height));
        margin: 10px;
        border: 1px solid gray;
        border-radius: 6px;
        overflow: auto;
        scrollbar-color: white transparent;
      }
      #display-window {
        padding: 15px 10px;
        justify-content: center;
      
        & .grid {
          display: inline-grid;
          text-align: left;
          justify-content: center;
          font-size: var(--font-size-1);
          padding-top: 1.5em;
        }
        & .grid .row {
          display: contents;
          cursor: default;
        }
        & .grid .row.isHovering span {
          text-shadow: 0px 0px 5px currentColor;
        }
        & .grid .row.isHovering .color-box {
          box-shadow: 0px 0px 5px currentColor;
        }
        & .title,
        & .subtitle {
          display: block;
          text-align: center;
          text-wrap: balance;
          color: white;
        }
        & .title {
          padding: 0.5em 0.8em;
          font-size: var(--font-size-3);
        }
        & .subtitle {
          padding: 1.5em 1.5em 0 1.5em;
          font-size: var(--font-size-1);
        }
        & .grid span {
          padding: 0.5em 0.8em;
        }
        &.day .grid {
          grid-template-columns: fit-content(40%) max-content max-content fit-content(40%);
        }
        &.month .grid,
        &.year .grid {
          grid-template-columns: max-content 1fr;
        }
        &.year .grid .color-box {
          aspect-ratio: 1;
          margin: 5px;
          background-color: currentColor;
        }
      }
      #attribution {
        color: lightgray;
        width: 100%;
        height: var(--copy-height);
        text-align: center;
        font-size: var(--font-size-0);
      }
      #sheets-link {
        color: #76ff9a;
      }
      #section-2 {
        position: relative;
        width: 58%;
        height: 100%;
      }
      #window-banner {
        display: flex;
        position: relative;
        background-image: linear-gradient(to bottom, white, lightgray);
        justify-content: space-between;
        align-items: center;
        height: 10%;
        padding: 10px;
        text-align: center;
        font-weight: bold;
        font-size: var(--font-size-4);
      
        & .radio-buttons {
          display: grid;
          grid-template-columns: repeat(3, max-content);
          gap: 4px;
        }
        & .button {
          color: black;
          cursor: pointer;
          font-size: var(--font-size-2);
          font-weight: bold;
          border: 1px solid gray;
          border-radius: 6px;
          box-shadow: 2px 2px 1px gray;
          transform: translate(-2px, -2px);
          background-image: linear-gradient(to bottom, white, lightgray);
          padding: 5px;
        }
        & .button:hover {
          box-shadow: 2px 2px 3px dimgray;
        }
        & .button:active,
        & .button.selected {
          transform: none;
          box-shadow: inset 1px 1px 1px gray;
          background-image: linear-gradient(to bottom, lightgray, white);
        }
        & .header {
          display: flex;
          position: absolute;
          left: 50%;
          width: 33%;
          transform: translate(-50%, 0);
          justify-content: space-between;
          align-items: center;
        }
        & .header .nav-btn {
          font-size: var(--font-size-5);
          transform: translate(0, -7%);
        }
        & .header .nav-btn:hover {
          cursor: pointer;
          text-shadow: 0 0 5px dimgray;
        }
      }
      #windows {
        position: absolute;
        width: 100%;
        height: 90%;
      }
      #day-window {
        height: 100%;
        display: none;
      
        &.selected {
          display: block;
        }
        & .top {
          height: 6%;
          font-size: var(--font-size-2);
          font-weight: bold;
          align-content: center;
          background-image: linear-gradient(to bottom, lightcyan, lightblue);
        }
        & .top .header {
          display: inline-block;
          position: absolute;
          text-align: center;
          width: 15%;
        }
        & .top .first-header {
          display: inline-block;
          text-align: right;
          width: 7%;
        }
        & .bottom {
          position: relative;
          height: 94%;
          font-size: var(--font-size-2);
        }
        & .grid {
          display: grid;
          height: 100%;
          grid-template-columns: 1fr;
        }
        & .grid .row {
          align-content: center;
        }
        & .grid .side-header {
          display: inline-block;
          text-align: right;
          white-space: nowrap;
          width: 7%;
        }
        & .bottom .event {
          display: inline-block;
          position: absolute;
          text-align: center;
          text-wrap: balance;
          align-content: center;
          overflow: scroll;
          scrollbar-width: none;
          border: 1px solid #FFFFFF00;
          border-radius: 6px;
          width: 15%;
          padding: 0px 6px;
        }
        & .bottom .event.isHovering {
          box-shadow: 1px 1px 3px black;
          border: 1px solid black;
          z-index: 1;
        }
        & .bottom .time-indicator {
          position: absolute;
          width: 100%;
          height: 0px;
          border: 1px dashed black;
          text-align: right;
          pointer-events: none;
          z-index: 2;
        }
        & .bottom .time-indicator span {
          position: absolute;
          transform: translate(-100%, -100%);
          text-wrap: nowrap;
        }
      }
      #month-window {
        display: none;
        height: 100%;
      
        &.selected {
          display: block;
        }
        & .day-header {
          display: grid;
          height: 5%;
          grid-template-columns: repeat(7, 1fr);
        }
        & .day-header-item {
          align-content: center;
          text-align: center;
          font-size: var(--font-size-1);
          background-image: linear-gradient(to bottom, lightcyan, lightblue);
          border: 1px solid lightgray;
          padding: 2px;
        }
        & .grid {
          display: grid;
          grid-template-columns: repeat(7, 1fr);
          grid-template-rows: repeat(6, 1fr);
          height: 95%;
        }
        & .grid .box {
          position: relative;
          padding: 4px;
          border: 1px solid lightgray;
          background-color: white;
          font-size: var(--font-size-1);
        }
        & .grid .box .date {
          position: absolute;
        }
        & .grid .box .name {
          width: 100%;
          height: 100%;
          text-align: center;
          align-content: center;
          text-wrap: balance;
        }
        & .grid .box.inactive {
          color: #888;
          background-color: #ccc;
        }
        & .grid .box:hover,
        & .grid .box.isHovering {
          cursor: pointer;
          box-shadow: 1px 1px 3px black;
          border: 1px solid black;
          z-index: 1;
        }
        & .grid .box.selected {
          border: 1px solid black;
        }
        & .grid .box.today {
          border: 2px solid black;
        }
        & .grid .box.today .date {
          font-weight: bold;
        }
      }
      #year-window {
        display: none;
        height: 100%;
        background-color: lightgray;
      
        &.selected {
          display: block;
        }
        & .grid {
          display: grid;
          margin-left: auto;
          height: 100%;
          grid-template-columns: repeat(4, 1fr);
          grid-template-rows: repeat(3, 1fr);
          padding: 3px;
          gap: 3px;
        }
        & .grid .month {
          border: 1px solid black;
          box-shadow: 1px 1px 2px black;
        }
        & .grid .month:hover {
          box-shadow: 1px 1px 5px black;
          cursor: pointer;
        }
        & .grid .month .banner {
          font-size: var(--font-size-1);
          font-weight: bold;
          text-align: center;
          align-content: center;
          background-image: linear-gradient(to bottom, white, lightgray);
          height: 10%;
        }
        & .grid .month .mgrid {
          display: grid;
          grid-template-columns: repeat(7, 1fr);
          grid-template-rows: repeat(7, 1fr);
          font-size: var(--font-size-1);
          text-align: center;
          height: 90%;
        }
        & .grid .month .mgrid .day-name {
          background-image: linear-gradient(to bottom, lightcyan, lightblue);
          border: 1px solid lightgray;
          align-content: center;
        }
        & .grid .month .mgrid .date {
          position: relative;
          background-color: white;
          border: 1px solid lightgray;
          align-content: center;
        }
        & .grid .month .mgrid .date.isHovering {
          box-shadow: 1px 1px 2px black;
          z-index: 1;
        }
        & .grid .month .mgrid .date:hover,
        & .grid .month .mgrid .date.selected {
          cursor: pointer;
          border: 1px solid black;
        }
        & .grid .month .mgrid .date.selected:hover {
          cursor: pointer;
          border: 2px solid black;
        }
        & .grid .month .mgrid .date.today {
          border: 2px solid black;
          font-weight: bold;
        }
        & .grid .month .mgrid .date.today:hover {
          border: 3px solid black;
        }
      }
      #print-container {
        display: none;
        width: 100%;
        text-align: center;
        margin: 0;
      
        & .title {
          font-size: 28px;
          font-weight: bold;
          text-wrap: balance;
          padding: 5px;
        }
        & .subtitle {
          font-size: 20px;
          padding-top: 1.5em;
          text-wrap: balance;
        }
        & table {
          display: inline-block;
          text-align: left;
          font-size: 16px;
          padding-top: 1.5em;
          border-collapse: collapse;
        }
        & th,
        & td {
          border: 1px solid black;
          padding: 8px;
          max-width: 300px;
        }
        & td:nth-child(2),
        & td:nth-child(3),
        & td:nth-child(4) {
          white-space: nowrap;
        }
        & th {
          text-wrap: nowrap;
        }
      }
      @media (orientation: portrait) {
        :root {
          --font-size-0: 0.8cqh;
          --font-size-1: 1cqh;
          --font-size-2: 1.25cqh;
          --font-size-3: 1.5cqh;
          --font-size-4: 2cqh;
          --font-size-5: 3cqh;
          --logo-height: 10vh;
          --copy-height: 2vh;
        }
        main {display: block;}
        #section-1 {width: 100%; height: 50%;}
        #section-2 {width: 100%; height: 50%;}
      }
      @media print {
        :root {background-color: transparent;}
        main {display: none;}
        #print-container {display: block;}
      }
    </style>
  </head>

    <script>
      
      // Pure/Inspector Functions (write:none)
      
      function clamp(num, min, max) {
        return Math.min(Math.max(num, min), max);
      }
      function checkPrefix(prefix, text) {
        if (text.startsWith(prefix)) {
          return [true, text.slice(prefix.length)];
        } else {
          return [false, text];
        }
      }
      function isValidDate(dateStr) {
        return !isNaN(new Date(dateStr).getTime());
      }
      function isValidDateRange(dateRangeStr) {
        const dates = dateRangeStr.split('-');
        if (dates.length >= 3 || dates.length === 0) return false;
        return dates.every(d => isValidDate(d));
      }
      function getDateRange(dateRangeStr) {
        let [start, end] = dateRangeStr.split('-');
        if (!end) end = start;
        return [new Date(start), new Date(end)];
      }
      function toDateStr(date) {
        return [date.getMonth() + 1, date.getDate(), date.getFullYear()].join('/');
      }
      function titleCase(text) {
        return text.trim().toLowerCase().replace(/\b(?<!')\w/g, char => char.toUpperCase());
      }
      function startOfMonth(day) {
        return new Date(day.getFullYear(), day.getMonth(), 1)
      }
      function endOfMonth(day) {
        return new Date(day.getFullYear(), day.getMonth() + 1, 0)
      }
      function startOfWeek(day) {
        return new Date(day.getFullYear(), day.getMonth(), day.getDate() - day.getDay())
      }
      function parseTime(timeString) {
        const timeRegex = /^(?<hours>0?[1-9]|1[0-2]):(?<minutes>[0-5]\d)(?::(?<seconds>[0-5]\d))?\s?(?<meridian>[AaPp][Mm])$/;
        const match = timeRegex.exec(timeString.trim());
        if (!match) return null;
        const {hours, minutes, seconds, meridian} = match.groups;
        return {
          hours: Number(hours),
          minutes: Number(minutes),
          seconds: Number(seconds || 0),
          meridian: meridian.toLowerCase(),
        };
      }
      function strToHours(timeString) {
        const match = parseTime(timeString);
        if (!match) return null;
        let {hours, minutes, seconds, meridian} = match;
        if (hours === 12) hours = 0;
        if (meridian === 'pm') hours += 12;
        return hours + minutes/60 + seconds/3600;
      }
      function getElemIndex(target, depth=1) {
        let parent = target.parentElement;
        let child = target;
        for (let i = 1; i < depth; i++) {
          child = parent;
          parent = child.parentElement;
        }
        return [...parent.children].indexOf(child);
      }
      function* csvLines(csvString) {
        const lineRegex = /(?:[^"\r\n]|"(?:""|[^"])*")+/g;
        const columnRegex = /("(?:[^"]|"")*"|[^,]*)(?:,|$)/g;
        for (const lineMatch of csvString.matchAll(lineRegex)) {
          const csvLine = lineMatch[0];
          const columns = [];
          for (const colMatch of csvLine.matchAll(columnRegex)) {
            let cell = colMatch[1];
            if (cell.startsWith('"') && cell.endsWith('"')) {
              cell = cell.slice(1, -1).replace(/""/g, '"');
            }
            columns.push(cell);
          }
          if (!csvLine.endsWith(',')) columns.pop();
          yield columns;
        }
      }
      function toCsvString(csvData) {
        return csvData.map(row => {
          return row.map(cell => {
            const isEscaped = /[,\n\r"]/.test(cell);
            return isEscaped ? `"${cell.replace(new RegExp('"','g'),'""')}"` : cell;
          }).join(',');
        }).join('\n');
      }
      function* dataLines(csvData) {
        for (let line of csvLines(csvData)) {
          if (line.length === 0) continue;
          line = line.map(s => s.trim());
          if (line[0].startsWith('#')) continue;
          if (!line.some(Boolean)) continue;
          yield line;
        }
      }
      function* loop(array, i = 0) {
        if (array.length === 0) return;
        while (true) {
          if (i >= array.length) i = 0;
          yield array[i++];
        }
      }
      function fetchSheet(sheetID, gid) {
        return fetch(`https://docs.google.com/spreadsheets/d/${sheetID}/export?format=csv&gid=${gid}`);
      }
      function parseCategoryPage(data) {
        const result = {};
        for (const [name, color] of dataLines(data)) {
          result[titleCase(name)] = color;
        }
        return result
      }
      function parseDataPage(data) {
        const entries = [];
        let day;
        for (const [first, ...rest] of dataLines(data)) {
          const [added, identifier] = checkPrefix('&', titleCase(first));
          if (isValidDateRange(identifier)) {
            day = '';
            const [start, end] = getDateRange(identifier);
            let [title, categories, notes] = rest;
            title = titleCase(title);
            categories = titleCase(categories).split(',').map(s => s.trim());
            entries.push(new DayEntry(start, end, title, categories, notes, {added: added}));
          } else if (entries.length === 0) {
            continue;
          } else {
            if (dayNames.includes(identifier)) day = identifier;
            entries.at(-1).addToSchedule(rest, day);
          }
        }
        return entries;
      }
      function getData(key) {
        return eventData.get(key) || new DayInfo();
      }
      
      // Mutators (write:inner)
      
      function addTime(date, mode, amount) {
        let month;
        switch (mode.toLowerCase()) {
          case 'year':
            month = date.getMonth();
            date.setFullYear(date.getFullYear() + amount);
            if (date.getMonth() != month) date.setMonth(date.getMonth(), 0);
            break;
          case 'month':
            month = date.getMonth() + amount;
            date.setMonth(month);
            if (month < 0) month += 12;
            if (date.getMonth() % 12 != month % 12) date.setMonth(date.getMonth(), 0);
            break;
          case 'day':
            date.setDate(date.getDate() + amount);
            break;
        }
      }
      function addElem(elem, tag, ...classes) {
        const newElem = document.createElement(tag);
        newElem.classList.add(...classes);
        elem.appendChild(newElem);
        return newElem;
      }
      function addDiv(elem, ...classes) {
        return addElem(elem, 'div', ...classes);
      }
      function addSpan(elem, text, ...classes) {
        const newElem = document.createElement('span');
        newElem.classList.add(...classes);
        elem.appendChild(newElem);
        newElem.innerText = text;
        return newElem;
      }
      function selectFrom(nodes, index) {
        for (const [i, n] of [...nodes].entries()) {
          n.classList.toggle('selected', i === index);
        }
      }
      function objSet(obj, newObj) {
        for (const key in obj) delete obj[key];
        Object.assign(obj, newObj);
      }
      function addToArrayMap(data, key, value) {
        if (key in data) {
          data[key].push(value)
        } else {
          data[key] = [value];
        }
      }
      function addTable(container, textArray) {
        const table = addElem(container, 'table');
        const tbody = addElem(table, 'tbody');
        for (const row of textArray) {
          const tr = addElem(tbody, 'tr');
          for (const item of row) {
            const td = addElem(tr, 'td');
            td.innerText = item;
          }
        }
      }
      function buildPrintPage(container, date) {
        
        container.innerHTML = '';

        addTitle = (text, clss) => {
          const title = addDiv(container, clss);
          title.innerText = text;
          return title;
        }
        
        addBuffer = (buffer) => {
          while (buffer.every(row => row.at(-1) === '')) {
            buffer.forEach(row => row.pop());
          }
          addTable(container, buffer);
          buffer.length = 0;
        }
        
        const key = toDateStr(date);
        const weekday = dayNames[date.getDay()];
        const dayInfo = getData(key);
        addTitle(dayInfo.title, 'title');
        const dayTitle = addTitle(`${weekday} ${key}`, 'subtitle');
        dayTitle.style.paddingTop = '0';
        if (dayInfo.notes) addTitle(dayInfo.notes, 'subtitle');
        
        const buffer = [];
        for (const [i, row] of dayInfo.schedule.entries()) {
          const isSubtitle = !row.slice(1).some(Boolean);
          if (isSubtitle) {
            if (buffer.length > 0) addBuffer(buffer);
            addTitle(row[0], 'subtitle');
          } else {
            buffer.push(row.map(r => (r === undefined) ? '' : r));
          }
        }
        if (buffer.length > 0) addBuffer(buffer);
      }
      
      // Macros (write:outer)
      
      function updateFromCache(sheetID) {
        const load = s => localStorage.getItem(sheetID + s);
        eventData.setEvents(parseDataPage(load('eventData') || ''));
        eventData.setCategories(parseCategoryPage(load('categoryData') || ''));
        currentTab = Number(localStorage.getItem('currentTab') || currentTab);
        let sessionDate = sessionStorage.getItem('currentDate');
        sessionDate = sessionDate ? new Date(sessionDate) : new Date();
        for (const w of windows) {
          w.date.setTime(sessionDate);
        }
        selectTab(currentTab);
      }
      function updateFromSheet(sheetID, gidList) {
        const responses = gidList.map(gid => fetchSheet(sheetID, gid));
        Promise.all(responses).then(rList => {
          if (rList.some(r => !r.ok)) throw new Error();
          return Promise.all(rList.map(r => r.text()));
        }).then(data => {
          eventData.setEvents(parseDataPage(data[0]));
          eventData.setCategories(parseCategoryPage(data[1]));
          refresh();
          localStorage.clear();
          localStorage.setItem('currentTab', currentTab);
          const start = windows[2].getFirstDay();
          const end = windows[2].getLastDay();
          const eventCsv = eventData.entries
            .filter(e => e.startDate <= end && e.endDate >= start)
            .map(e => e.toArray()).map(e => toCsvString(e)).join('\n');
          const categoryCsv = toCsvString(Object.entries(eventData.categories));
          localStorage.setItem(sheetID + 'eventData', eventCsv);
          localStorage.setItem(sheetID + 'categoryData', categoryCsv);
        }).catch(error => {
          alert('Error fetching spreadsheet data', 2000);
        });
      }
      function togglePrintView() {
        const container = document.getElementById('print-container');
        const main = document.querySelector('main');
        const root = document.documentElement;
        const display = window.getComputedStyle(container).display;
        if (display === 'none') {
          buildPrintPage(container, windows[0].date);
          container.style.display = 'block';
          main.style.display = 'none';
          root.style.backgroundColor = 'white';

          root.style.removeProperty('background-color');

      function syncDates() {

        for (let i = currentTab + 1; i < windows.length; i++) {
          windows[i].date.setTime(time);

        } else if (currentTab === 2) {

      function navigate(amount) {

      function goToDate(date) {

      // Pure Classes (write: none)
      class ScheduleEntry {
        constructor(description, location, startTime, endTime, instructors) {
          this.description = description;
          this.location = location;
          this.startTime = startTime;
          this.endTime = endTime;
          this.instructors = instructors;
        }
      }
      
      class DayEntry {
        constructor(startDate, endDate, title, categories, notes, flags) {
          this.startDate = startDate;
          this.endDate = endDate;
          this.title = title;
          this.categories = categories;
          this.notes = notes;
          this.flags = flags || {};
          this.schedule = {};
        }
        
        addToSchedule(scheduleEntry, key='') {
          if (Object.hasOwn(this.schedule, key)) {
            this.schedule[key].push(scheduleEntry);
          } else {
            this.schedule[key] = [scheduleEntry];
          }
        }
        
        getDayInfo(date) {
          const schedule = [];
          const day = dayNames[date.getDay()];
          const keys = Object.keys(this.schedule);
          if (keys.includes('')) schedule.push(...this.schedule['']);
          if (keys.includes(day)) schedule.push(...this.schedule[day]);
          return new DayInfo(this.title, this.categories, this.notes, schedule);
        }
        
        includes(date) {
          const keys = Object.keys(this.schedule);
          return keys.length === 0
            || keys.includes('')
            || keys.includes(dayNames[date.getDay()]);
        }
        
        toArray() {
          const rows = [];
          rows.push(['', this.title, this.categories.join(','), this.notes]);
          rows[0][0] = toDateStr(this.startDate) + '-' + toDateStr(this.endDate);
          if (this.flags.added) rows[0][0] = '&' + rows[0][0];
          let prevKey = '';
          for (const [key, entries] of Object.entries(this.schedule)) {
            const i = rows.length;
            for (const row of entries) {
              rows.push(['', ...row]);
            }
            rows[i][0] = key;
          }
          return rows;
        }
      }
      
      class DayInfo {
        constructor(title, categories, notes, schedule) {
          this.title = title || '';
          this.categories = categories || [];
          this.notes = notes || '';
          this.schedule = schedule || [];
        }
        
        combine(other) {
          const titles = [this.title, other.title];
          const categories = [...this.categories, ...other.categories];
          const notes = [this.notes, other.notes];
          const schedule = [...this.schedule, ...other.schedule];
          return new DayInfo(
            titles.filter(Boolean).at(-1) || '',
            categories.filter(Boolean),
            notes.filter(Boolean).join('\n'),
            schedule.filter(Boolean),
          )
        }
      }
      
      class DateMap {
        constructor() {
          this._dateMap = new Map();
          this.entries = [];
          this.categories = {};
        }
        
        setCategories(categories) {
          objSet(this.categories, categories);
        }
        
        setEvents(dayEntries) {
          this._dateMap.clear();
          this.entries.length = 0;
          this.entries.push(...dayEntries);
          for (const entry of dayEntries) {
            let date = new Date(entry.startDate);
            while (date <= entry.endDate) {
              if (entry.includes(date)) {
                const dayInfo = entry.getDayInfo(date);
                const key = toDateStr(date);
                if (!this._dateMap.has(key) || !entry.flags.added) {
                  this._dateMap.set(key, dayInfo)
                } else {
                  this._dateMap.set(key, this._dateMap.get(key).combine(dayInfo))
                }
              }
              date.setDate(date.getDate() + 1);
            }
          }
        }
        
        get(date) {
          return this._dateMap.get(date);
        }
      }
      
      // Mutator Classes (write:inner)

                const row = addDiv(grid, 'row');

      class DayWindow {
        constructor(elem) {
          this.date = new Date();
          this.elem = elem;
          this.top = addDiv(this.elem, 'top');
          this.bottom = addDiv(this.elem, 'bottom');
          this.grid = addDiv(this.bottom, 'grid');
          addSpan(this.top, 'Time', 'first-header');
          this.startHour = 14;
          this.endHour = 21;
          this.events = [];
          this.timers = {}
        }
        
        addTimer() {
          this.timeDiv = addDiv(this.bottom, 'time-indicator');
          this.timeDivText = addSpan(this.timeDiv, '');
          this.updateTimeDiv();
          if (this.timers.interval) clearInterval(this.timers.interval);
          if (this.timers.timeout) clearTimeout(this.timers.timeout);
          this.timers.timeout = setTimeout(() => {
            this.updateTimeDiv();
            this.timers.interval = setInterval(() => this.updateTimeDiv(), 1000);
          }, 1000 - new Date().getMilliseconds())
        }
        
        updateTimeDiv() {
          const now = new Date();
          let display = 'none'
          if (toDateStr(this.date) === toDateStr(now)) {
            const time = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600
            const offset = time - this.startHour;
            const rowCount = this.endHour - this.startHour + 1;
            if (offset >= 0 && offset <= rowCount) {
              display = 'block';
              this.timeDivText.innerText = now.toLocaleTimeString();
              this.timeDiv.style.bottom = `${100*(1 - offset/rowCount)}%`
            }
          }
          this.timeDiv.style.display = display;
        }
        
        buildGridRows(startHour, endHour) {
          this.grid.innerHTML = '';
          let time = new Date();
          time.setHours(startHour, 0, 0, 0);
          for (let i=startHour; i<=endHour; i++) {
            const row = addDiv(this.grid, 'row');
            const headerText = time.toLocaleTimeString('en-US', {
              hour: 'numeric',
              hour12: true,
            }).toLowerCase();
            const s = addSpan(row, headerText, 'side-header');
            const color = ((i-startHour) % 2 === 0) ? 'lightgray' : 'white';
            row.style.backgroundColor = color;
            time.setHours(time.getHours() + 1);
          }
          this.startHour = startHour;
          this.endHour = endHour;
        }
        
        render() {
          const dayInfo = getData(toDateStr(this.date));
          const colors = loop(palette);
          this.top.replaceChildren(this.top.firstElementChild)
          this.bottom.replaceChildren(this.bottom.firstElementChild)
          this.events.length = 0;
          let [startHour, endHour] = [14, 0];
          const locations = [];
          for (const [name, location, start, end] of dayInfo.schedule) {
            if (!start || !end) continue;
            startHour = Math.floor(Math.min(startHour, strToHours(start)));
            endHour = Math.ceil(Math.max(endHour, strToHours(end)));
            let index = locations.indexOf(location) + 1;
            if (index === 0 && location) {
              index = locations.length + 1;
              locations.push(location);
              const header = addSpan(this.top, location, 'header');
              header.style.left = `${15*index-6}%`;
            }
          }
          endHour = Math.max(endHour, startHour + 7);
          this.buildGridRows(startHour, endHour);
          const count = endHour - startHour + 1;
          for (let [name, location, start, end] of dayInfo.schedule) {
            let index = locations.indexOf(location) + 1;
            const block = addDiv(this.bottom, 'event');
            this.events.push(block);
            if (!start || !end) {
              block.style.display = 'none';
              continue;
            };
            [start, end] = [start, end].map(strToHours);
            const offset = start - startHour;
            const duration = end - start;
            block.style.top = `${100*offset/count}%`;
            block.style.left = `${15*index-6}%`
            block.style.height = `${100*duration/count}%`;
            block.style.backgroundColor = colors.next().value;
            block.innerText = name;
            if (!location) {
              block.style.left = `${15-6}%`
              block.style.width = `${15*locations.length}%`;
              block.style.backgroundColor = 'transparent';
            }
          }
          this.addTimer();
        }
      }

        getFirstDay() {

          return new Date(year, this.monthOffset, 1);
        }
        
        getLastDay() {

          if (this.date.getMonth() < this.monthOffset) year--;
          return new Date(year, this.monthOffset, 0);

                box.innerText = '';
                box.style.backgroundColor = '';
                box.classList.toggle('today', false);
                box.classList.toggle('selected', false);
              }

            addTime(monthStart, 'month', 1);
          }
        }
      }
      
      class HoverLinker { // Adds isHovering class to linked objects
        constructor() {
          this.controller = new AbortController();
          this.links = []
        }
        
        link(...elems) {
          this.links.push(elems);
          const index = this.links.length-1;
          for (const elem of elems) {
            elem.addEventListener('mouseenter', () => this.setAll(index, true), {signal: this.controller.signal});
            elem.addEventListener('mouseleave', () => this.setAll(index, false), {signal: this.controller.signal});
          };
        }
        
        linkFirst(first, rest) {
          if (!rest) rest = [];
          this.links.push([first, ...rest]);
          const index = this.links.length - 1;
          first.addEventListener('mouseenter', () => this.setAll(index, true), {signal: this.controller.signal});
          first.addEventListener('mouseleave', () => this.setAll(index, false), {signal: this.controller.signal});
          for (const elem of rest) {
            elem.addEventListener('mouseenter', () => this.setFirst(index, true), {signal: this.controller.signal});
            elem.addEventListener('mouseleave', () => this.setFirst(index, false), {signal: this.controller.signal});
          }
        }
        
        setAll(index, bool) {
          for (const elem of this.links[index]) {
            elem.classList.toggle('isHovering', bool);
          };
        }
        
        setFirst(index, bool) {
          this.links[index][0].classList.toggle('isHovering', bool);
        }
        
        abort() {
          for (let i = 0; i < this.links.length; i++) {
            this.setAll(i, false);
          }
          this.links.length = 0;
          this.controller.abort();
          this.controller = new AbortController();
        }
      }
      
      class Divider { // Line between two elements to click and drag
        constructor(elem1, elem2) {
          this.elem1 = elem1;
          this.elem2 = elem2;
          this.thickness = 12;
          this.divider = document.createElement('div');
          this.divider.className = 'divider';
          this.elem1.after(this.divider);
          this.mediaQuery = window.matchMedia('(orientation: portrait)');
          this.mediaQuery.addEventListener('change', () => this.reset());
          this.divider.addEventListener('dblclick', () => this.reset());
          this.divider.addEventListener('pointerdown', e => {
            const controller = new AbortController();
            window.addEventListener('pointermove', e => this.onDrag(e), {signal: controller.signal});
            window.addEventListener('pointerup', e => controller.abort(), {signal: controller.signal});
          })
          this.updateBoxes();
        }
        
        updateBoxes() {
          this.prect = this.elem1.parentElement.getBoundingClientRect();
          this.rect1 = this.elem1.getBoundingClientRect();
          this.rect2 = this.elem2.getBoundingClientRect();
          this.orientation = (this.rect1.right === this.rect2.left) ? 'vertical' : 'horizontal';
          if (this.orientation === 'vertical') {
            this.divider.style.width = `${this.thickness}px`;
            this.divider.style.cursor = 'ew-resize';
            this.divider.style.height = '100%';
            this.divider.style.top = '0';
            const pixels = this.rect1.right - this.thickness / 2
            this.divider.style.left = `${100*pixels/this.prect.width}%`;
          } else {
            this.divider.style.width = '100%';
            this.divider.style.height = `${this.thickness}px`;
            this.divider.style.cursor = 'ns-resize';
            this.divider.style.left = '0';
            const pixels = this.rect1.bottom - this.thickness / 2;
            this.divider.style.top = `${100*pixels/this.prect.height}%`;
          }
        }
        
        reset() {
          this.elem1.style.removeProperty('width');
          this.elem1.style.removeProperty('height');
          this.elem2.style.removeProperty('width');
          this.elem2.style.removeProperty('height');
          this.updateBoxes();
        }
        
        onDrag(e) {
          if (this.orientation === 'vertical') {
            const w1 = e.clientX - this.rect1.left;
            const w2 = this.rect2.right - e.clientX;
            this.elem1.style.width = `${clamp(100*w1/this.prect.width, 0, 100)}%`;
            this.elem2.style.width = `${clamp(100*w2/this.prect.width, 0, 100)}%`;
          } else if (this.orientation === 'horizontal') {
            const h1 = e.clientY - this.rect1.top;
            const h2 = this.rect2.bottom - e.clientY;
            this.elem1.style.height = `${clamp(100*h1/this.prect.height, 0, 100)}%`;
            this.elem2.style.height = `${clamp(100*h2/this.prect.height, 0, 100)}%`;
          }
          this.updateBoxes();
        }
      }
