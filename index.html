<!DOCTYPE html>

<html lang="en">
  <head>
    <title>SWDC Calendar</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Southwest Washington Dance Center (SWDC) calendar and schedule viewer">
    <link rel="preload" as="image" fetchpriority="high" href="https://images.squarespace-cdn.com/content/v1/5fa31a9e206c8a69fd49cfda/1611602029932-VTFLL1ATNQGALUG35LPA/png.png">
    <style>
      * {
        margin: 0;
        min-width: 0;
        min-height: 0;
        font-family: sans-serif;
        box-sizing: border-box;
        user-select: none;
      }
      
      :root {
        height: 100%;
        background-color: #4c4a67;
        --font-size-1: 1cqw;
        --font-size-2: 1.25cqw;
        --font-size-3: 1.5cqw;
        --font-size-4: 2cqw;
        --font-size-5: 3cqw;
      }
      
      body {
        height: 100%;
      }
      
      main {
        display: flex;
        width: 100%;
        height: 100%;
      }
      
      #section-1 {
        position: relative;
        width: 30%;
        height: 100%;
        background-image: linear-gradient(to right, #232037, #1c1b1b);
      }

      #logo {
        padding: 10px;
        height: 20%;
        background-image: url('https://images.squarespace-cdn.com/content/v1/5fa31a9e206c8a69fd49cfda/1611602029932-VTFLL1ATNQGALUG35LPA/png.png');
        background-size: 85% 100%;
        background-origin: content-box;
        background-position: center;
        background-repeat: no-repeat;
      }
      
      #icons {
        position: absolute;
        right: 0;
        padding: 10px;
        text-align: right;
      }
      
      #icons svg {
        cursor: pointer;
        width: 8%;
      }
      
      #display {
        position: relative;
        text-align: center;
        height: calc(80% - 20px);
        margin: 10px;
        border: 1px solid gray;
        border-radius: 6px;
        overflow: auto;
        scrollbar-color: white #1d1c1f;
      }
      
      #display-window {
        display: inline-grid;
        max-height: 100%;
        text-align: left;
        font-size: var(--font-size-1);
        padding: 15px 10px;
      }
      
      #display-window .row {
        display: contents;
        cursor: default;
      }
      
      #display-window .row.isHovering span {
        text-shadow: 0px 0px 5px currentColor;
      }
      
      #display-window .row.isHovering .color-box {
        box-shadow: 0px 0px 5px currentColor;
      }
      
      #display-window span {
        padding: 0.5em 0.8em;
      }
      
      #display-window.day {
        grid-template-columns: fit-content(40%) 1fr max-content;
        text-wrap: balance;
      }
      
      #display-window.day .title {
        grid-column: 1 / -1;
        color: white;
        text-align: center;
        font-size: var(--font-size-3);
      }
      
      #display-window.day .subtitle {
        grid-column: 1 / -1;
        color: lightgray;
        text-align: center;
        text-wrap: balance;
        font-size: var(--font-size-1);
      }
      
      #display-window.month,
      #display-window.year {
        grid-template-columns: max-content 1fr;
      }
      
      #display-window.month .title,
      #display-window.year .title {
        grid-column: 1 / -1;
        color: white;
        text-align: center;
        font-size: var(--font-size-3);
      }
      
      #display-window.year .color-box {
        aspect-ratio: 1;
        margin: 5px;
        background-color: currentColor;
      }
      
      #divider {
        position: absolute;
        left: calc(30% - 10px);
        width: 10px;
        height: 100%;
        cursor: col-resize;
        z-index: 1;
        touch-action: none;
      }
      
      #section-2 {
        position: relative;
        width: 70%;
        height: 100%;
      }

      #window-banner {
        display: flex;
        position: relative;
        background-image: linear-gradient(to bottom, white, lightgray);
        justify-content: space-between;
        align-items: center;
        height: 10%;
        padding: 0 10px;
        text-align: center;
        font-weight: bold;
        font-size: var(--font-size-4);
      }
      
      #mode-buttons {
        color: gray;
        font-size: 0px; /*Required to make browser stop adding space between divs*/
      }

      #mode-buttons div {
        font-size: var(--font-size-2);
        font-weight: bold;
        left: 0px;
        display: inline-block;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 6px;
      }

      #mode-buttons div:hover {
        background-color: lightgray;
      }

      #mode-buttons div.selected {
        background-color: #595e68;
        color: white;
      }

      #window-banner .header {
        display: flex;
        position: absolute;
        left: 50%;
        width: 30%;
        transform: translate(-50%, 0);
        justify-content: space-between;
        align-items: center;
      }
      
      #window-banner .header .nav-btn {
        font-size: var(--font-size-5);
        transform: translate(0, -7%);
      }

      #window-banner .header .nav-btn:hover {
        cursor: pointer;
      }
      
      #window-banner .button {
        font-size: var(--font-size-2);
        font-weight: bold;
        border: 1px solid gray;
        border-radius: 6px;
        box-shadow: 1px 1px 1px gray;
        background-image: linear-gradient(to bottom, white, lightgray);
        padding: 4px;
      }
      
      #window-banner .button:hover {
        cursor: pointer;
        box-shadow: 1px 1px 3px gray;
      }
      
      #window-banner .button:active {
        box-shadow: inset 1px 1px 3px gray;
        background-image: linear-gradient(to bottom, lightgray, white);
      }

      #windows {
        position: absolute;
        width: 100%;
        height: 90%;
      }

      #day-window {
        height: 100%;
        display: none;
      }
      
      #day-window.selected {
        display: block;
      }

      #day-window .top {
        height: 6%;
        font-size: var(--font-size-2);
        font-weight: bold;
        align-content: center;
        background-image: linear-gradient(to bottom, lightcyan, lightblue);
      }

      #day-window .top .header {
        display: inline-block;
        position: absolute;
        text-align: center;
        width: 15%;
      }
      
      #day-window .top .first-header {
        display: inline-block;
        text-align: right;
        width: 7%;
      }

      #day-window .grid {
        display: grid;
        grid-template-columns: 1fr;
        height: 94%;
        font-size: var(--font-size-2);
      }

      #day-window .grid .row {
        align-content: center;
      }

      #day-window .grid .side-header {
        display: inline-block;
        text-align: right;
        white-space: nowrap;
        width: 7%;
      }

      #day-window .grid .event {
        display: inline-block;
        position: absolute;
        text-align: center;
        text-wrap: balance;
        align-content: center;
        border-radius: 6px;
        width: 15%;
        padding: 3px;
      }

      #day-window .grid .event.isHovering {
        box-shadow: 1px 1px 3px black;
        border: 1px solid black;
      }
      
      #day-window .grid .current-time {
        position: absolute;
        width: 100%;
        height: 0px;
        border: 1px dashed black;
        text-align: right;
      }
      
      #day-window .grid .current-time span {
        position: absolute;
        transform: translate(-100%, -100%);
        text-wrap: nowrap;
      }

      #month-window {
        display: none;
        height: 100%;
      }
      
      #month-window.selected {
        display: block;
      }

      #month-window .day-header {
        display: grid;
        height: 5%;
        grid-template-columns: repeat(7, 1fr);
      }

      #month-window .day-header-item {
        align-content: center;
        text-align: center;
        font-size: var(--font-size-1);
        background-image: linear-gradient(to bottom, lightcyan, lightblue);
        border: 1px solid lightgray;
        padding: 2px;
      }

      #month-window .grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        grid-template-rows: repeat(6, 1fr);
        height: 95%;
      }

      #month-window .grid .box {
        position: relative;
        padding: 4px;
        border: 1px solid lightgray;
        background-color: white;
        font-size: var(--font-size-1);
      }
      
      #month-window .grid .box .date {
        position: absolute;
      }
      
      #month-window .grid .box .name {
        width: 100%;
        height: 100%;
        text-align: center;
        align-content: center;
      }

      #month-window .grid .box.inactive {
        color: #888;
        background-color: #ccc;
      }

      #month-window .grid .box:hover,
      #month-window .grid .box.isHovering {
        cursor: pointer;
        box-shadow: 1px 1px 3px black;
        border: 1px solid black;
        z-index: 1;
      }
      
      #month-window .grid .box.selected {
        border: 1px solid black;
      }
      
      #month-window .grid .box.today {
        border: 2px solid black;
      }
      
      #month-window .grid .box.today .date {
        font-weight: bold;
      }

      #year-window {
        display: none;
        height: 100%;
        border: 4px solid lightgray;
      }
      
      #year-window.selected {
        display: block;
      }

      #year-window .grid {
        display: grid;
        margin-left: auto;
        height: 100%;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 1fr);
        padding: 3px;
        gap: 3px;
      }

      #year-window .grid .month .banner {
        font-size: var(--font-size-1);
        font-weight: bold;
        text-align: center;
        align-content: center;
        background-image: linear-gradient(to bottom, white, lightgray);
        height: 10%;
      }
      
      #year-window .grid .month .banner:hover {
        border: 1px solid black;
        cursor: pointer;
      }

      #year-window .grid .month .mgrid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        grid-template-rows: repeat(7, 1fr);
        font-size: var(--font-size-1);
        text-align: center;
        height: 90%;
      }

      #year-window .grid .month .mgrid .day-name {
        background-image: linear-gradient(to bottom, lightcyan, lightblue);
        border: 1px solid lightgray;
        align-content: center;
      }

      #year-window .grid .month .mgrid .date {
        position: relative;
        background-color: white;
        border: 1px solid lightgray;
        align-content: center;
      }
      
      #year-window .grid .month .mgrid .date.isHovering {
        box-shadow: 1px 1px 3px black;
        z-index: 1;
      }
      
      #year-window .grid .month .mgrid .date:hover,
      #year-window .grid .month .mgrid .date.selected {
        cursor: pointer;
        border: 1px solid black;
      }
      
      #year-window .grid .month .mgrid .date.selected:hover {
        cursor: pointer;
        border: 2px solid black;
      }
      
      #year-window .grid .month .mgrid .date.today {
        border: 3px solid black;
        font-weight: bold;
      }
      
      #year-window .grid .month .mgrid .date.today:hover {
        border: 4px solid black;
      }
      
      #print-container {
        display: none;
        width: 100%;
        text-align: center;
        text-wrap: balance;
        margin: 0;
      }
      
      #print-container .title {
        font-size: 28px;
        font-weight: bold;
        padding: 5px;
      }
      
      #print-container .subtitle {
        font-size: 20px;
      }
      
      #print-container .notes {
        font-size: 16px;
        padding: 20px;
      }
      
      #print-container table {
        display: inline-block;
        text-align: left;
        font-size: 16px;
        border-collapse: collapse;
      }
      
      #print-container th, #print-container td {
        border: 1px solid black;
        padding: 10px;
      }
      
      #print-container th {
        text-wrap: nowrap;
      }
      
      @media (orientation: portrait) {
        :root {
          --font-size-1: 1cqh;
          --font-size-2: 1.25cqh;
          --font-size-3: 1.5cqh;
          --font-size-4: 2cqh;
          --font-size-5: 3cqh;
        }
        #logo {background-size: 50% 100%;}
        #section-1 {width: 100%; height: 50%;}
        #divider {
          height: 10px;
          width: 100%;
          top: calc(50% - 10px);
          left: 0;
          cursor: row-resize;
        }
        #section-2 {width: 100%; height: 50%;}
        main {display: block;}
      }
      
      @media print {
        main {display: none;}
        #print-container {display: block;}
      }
    </style>
  </head>
  
  <body>
    
    <main>
      <div id="section-1">
        <a href="https://www.swwdance.org/" target="_blank" rel="noopener noreferrer" aria-label="SWDC Homepage">
          <div id="logo"></div>
        </a>
        <div id="display">
          <div id="icons">
            <svg id="print-icon" onclick="printSchedule()" xmlns="http://w3.org" viewBox="0 0 24 24" fill="lightgray" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 10h16a2 2 0 012 2v5a2 2 0 01-2 2H4a2 2 0 01-2-2v-5a2 2 0 012-2z"/>
              <path d="M18 10V4a1 1 0 00-1-1H7a1 1 0 00-1 1v6M6 16h12v6H6z"/>
              <circle cx="18" cy="13" r="1" fill="currentColor"/>
            </svg>
          </div>
        </div>
      </div>
      
      <div id="divider"></div>
      
      <div id="section-2">
        <div id="window-banner">
          <div id="mode-buttons">
            <div onclick="selectTab(0)">Day</div>
            <div onclick="selectTab(1)">Month</div>
            <div onclick="selectTab(2)">Year</div>
          </div>
          <div class="header">
            <div onclick="navigate(-1)" class="nav-btn">‹</div>
            <div class="title-text"></div>
            <div onclick="navigate(1)" class="nav-btn">›</div>
          </div>
          <div id="today-button" onclick="goToDate(Date.now())" class="button">Today</div>
        </div>
        <div id="windows">
        </div>
      </div>
    </main>
    
    <div id="print-container">
    </div>
    
    <script>
      
      const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const palette = ['pink', 'skyblue', 'goldenrod', 'lightgreen', 'tan', 'khaki', 'aquamarine', 'mediumpurple'];
      
      // Deterministic Functions
      function addElem(elem, tag, ...classes) {
        const newElem = document.createElement(tag);
        newElem.classList.add(...classes);
        elem.appendChild(newElem);
        return newElem;
      }
      function addDiv(elem, ...classes) {
        return addElem(elem, 'div', ...classes);
      }
      function addSpan(elem, text, ...classes) {
        const newElem = document.createElement('span');
        newElem.classList.add(...classes);
        elem.appendChild(newElem);
        newElem.innerText = text;
        return newElem;
      }
      function selectFrom(nodes, index) {
        for (const [i, n] of [...nodes].entries()) {
          n.classList.toggle('selected', i == index);
        }
      }
      function dateStr(date, options={day:'numeric', month:'numeric', year:'numeric'}) {
        return date.toLocaleDateString('en-us', options);
      }
      function titleCase(text) {
        return text.trim().toLowerCase().replace(/\b\w/g, char => char.toUpperCase());
      }
      function objSet(obj, newObj) {
        for (const key in obj) delete obj[key];
        Object.assign(obj, newObj);
      }
      function startOfMonth(day) {
        return new Date(day.getFullYear(), day.getMonth(), 1)
      }
      function endOfMonth(day) {
        return new Date(day.getFullYear(), day.getMonth() + 1, 0)
      }
      function startOfWeek(day) {
        return new Date(day.getFullYear(), day.getMonth(), day.getDate() - day.getDay())
      }
      function addTime(date, mode, amount) {
        let month;
        switch (mode.toLowerCase()) {
          case 'year':
            month = date.getMonth();
            date.setFullYear(date.getFullYear() + amount);
            if (date.getMonth() != month) date.setMonth(date.getMonth(), 0);
            break;
          case 'month':
            month = date.getMonth() + amount;
            date.setMonth(month);
            if (month < 0) month += 12;
            if (date.getMonth() % 12 != month % 12) date.setMonth(date.getMonth(), 0);
            break;
          case 'day':
            date.setDate(date.getDate() + amount);
            break;
        }
      }
      function strToHours(timeStr) {
        const [time, modifier] = timeStr.split(' ');
        let [hours, minutes] = time.split(':').map(Number);
        if (hours == 12) hours = 0;
        if (modifier.toLowerCase() == 'pm') hours += 12;
        return hours + (minutes / 60);
      }
      function csvLineToArray(s) {
        let array = [];
        for (const match of s.trim().matchAll(/(".*?"),?|([^"]+)/g)) {
          if (match[1] === undefined) {
            array.push(...match[2].replace(/,$/g, '').split(','));
          } else {
            array.push(match[1].replace(/^"|"$/g, ''));
          }
        }
        return array;
      }
      function indexDateRangeMap(map, date, defaultValue) {
        for (const entry of map) {
          if (entry.startDate <= date && date <= entry.endDate) return entry;
        }
        return defaultValue;
      }
      function getElemIndex(target, depth=1) {
        let parent = target.parentElement;
        let child = target;
        for (let i = 1; i < depth; i++) {
          child = parent;
          parent = child.parentElement;
        }
        return [...parent.children].indexOf(child);
      }
      function parseCategoryPage(data) {
        const result = {};
        for (const row of data.split(/\r?\n/)) {
          const contents = csvLineToArray(row);
          const filtered = contents.filter(s => s != '')
          if (filtered.length == 0) continue;
          const [name, color] = contents;
          result[titleCase(name)] = color;
        }
        return result
      }
      function parseDataPage(data) {
        let date;
        const result = {};
        for (const row of data.split(/\r?\n/)) {
          const contents = csvLineToArray(row);
          const filtered = contents.filter(s => s != '')
          if (filtered.length == 0) continue;
          if (contents[0] != '') {
            date = contents[0];
            let [title, category, notes] = contents.slice(1);
            title = titleCase(title);
            category = titleCase(category);
            result[date] = {title:title, category:category, notes:notes, schedule:[]};
          } else {
            const entry = contents.slice(1);
            result[date].schedule.push(entry);
          }
        }
        return result;
      }
      function parseWeekPage(data) {
        const result = []
        let day;
        for (const row of data.split(/\r?\n/)) {
          const contents = csvLineToArray(row);
          const filtered = contents.filter(s => s != '')
          if (filtered.length == 0) continue;
          const firstValue = titleCase(contents[0]);
          if (firstValue == 'Duration') {
            const [startDate, endDate] = contents.slice(1,3);
            result.push({startDate: new Date(startDate), endDate: new Date(endDate)})
            continue;
          }
          if (result.length == 0) continue;
          const lastEntry = result.at(-1);
          if (dayNames.includes(firstValue)) {
            day = firstValue;
            lastEntry[day] = [];
          }
          if (day in lastEntry) {
            lastEntry[day].push(contents.slice(1,6));
          };
        }
        return result;
      }
      
      // Non Deterministic Functions
      function fetchData(dataURL, weekDataURL, categoryURL) {
        const promises = [
          fetch(dataURL).then(response => response.ok ? response.text() : null),
          fetch(weekDataURL).then(response => response.ok ? response.text() : null),
          fetch(categoryURL).then(response => response.ok ? response.text() : null),
        ]
        Promise.all(promises).then(data => {
          if (!data.every(Boolean)) return;
          objSet(eventData, parseDataPage(data[0]));
          objSet(weeklyData, parseWeekPage(data[1]));
          objSet(categories, parseCategoryPage(data[2]));
          refresh();
          localStorage.setItem('eventData', data[0]);
          localStorage.setItem('weekData', data[1]);
          localStorage.setItem('categoryData', data[2]);
        });
      }
      function getStored(key, value='') {
        let result = localStorage.getItem(key);
        if (result === null) result = value;
        return result;
      }
      function printSchedule() {
        const container = document.getElementById('print-container');
        container.innerHTML = '';
        const title = addDiv(container, 'title');
        const subtitle = addDiv(container, 'subtitle');
        const notes = addDiv(container, 'notes');
        const table = addElem(container, 'table');
        const thead = addElem(table, 'thead');
        const tbody = addElem(table, 'tbody');
        const w = windows[0];
        const key = dateStr(w.date);
        const weekday = dayNames[w.date.getDay()];
        const weekData = indexDateRangeMap(weeklyData, w.date, {});
        let dataTable = eventData[key] ? {...eventData[key]} : {title: 'Schedule', schedule: [], category: '', notes: ''};
        if (dataTable.schedule.length == 0 && dataTable.category != 'No Class') {
          dataTable.title = 'Schedule';
          if (weekday in weekData) dataTable.schedule = weekData[weekday];
        }
        title.innerText = dataTable.title;
        subtitle.innerText = `${weekday} ${key}`;
        notes.innerText = `${dataTable.notes}`;
        const header = addElem(thead, 'tr');
        for (const text of ['Description', 'Location', 'Start Time', 'End Time', 'Instructors']) {
          const elem = addElem(header, 'th');
          elem.innerText = text;
        }
        for (const items of dataTable.schedule) {
          const row = addElem(tbody, 'tr');
          for (let i = 0; i < 5; i++) {
            let item = items[i];
            if (item === undefined) item = '';
            const elem = addElem(row, 'td');
            elem.innerText = item;
          }
        }
        window.print();
      }
      function getData(date) {
        const key = dateStr(date);
        const weekday = dayNames[date.getDay()];
        const weekData = indexDateRangeMap(weeklyData, date, {});
        const dataTable = eventData[key] ? {...eventData[key]} : {title: 'Schedule', schedule: [], category: '', notes: ''};
        if (dataTable.schedule.length == 0 && dataTable.category != 'No Class') {
          dataTable.title = 'Schedule';
          if (weekday in weekData) dataTable.schedule = weekData[weekday];
        }
        return dataTable;
      }
      function syncDates() {
        const time0 = windows[0].date.getTime();
        const time = windows[currentTab].date.getTime();
        for (let i = currentTab + 1; i < windows.length; i++) {
          windows[i].date.setTime(time);
        };
        for (const w of windows.slice(1)) {
          w.selected.setTime(time0);
        };
      }
      function selectTab(index) {
        selectFrom(document.getElementById('mode-buttons').children, index);
        selectFrom(document.getElementById('windows').children, index);
        syncDates();
        windows[currentTab].onExit();
        currentTab = index;
        windows[currentTab].onEnter();
        displayObj.render();
        linkDisplay(currentTab);
        localStorage.setItem('currentTab', index);
      }
      function refresh() {
        windows[currentTab].onExit();
        windows[currentTab].onEnter();
        displayObj.render();
        linkDisplay(currentTab);
      }
      function linkDisplay(index) {
        hoverLinker.abort();
        const w = windows[index];
        const rows = displayObj.rows;
        if (index == 0 || index == 1) {
          for (let i = 0; i < rows.length; i++) {
            hoverLinker.link(rows[i], w.events[i]);
          }
        } else if (index == 2) {
          for (let i = 0; i < rows.length; i++) {
            const category = rows[i].querySelector('span').innerText;
            if (category in w.groups) {
              hoverLinker.linkFirst(rows[i], ...w.groups[category]);
            } else {
              hoverLinker.linkFirst(rows[i]);
            }
          }
        }
      }
      function navigate(amount) {
        const w = windows[currentTab];
        addTime(w.date, ['day', 'month', 'year'][currentTab], amount);
        refresh();
      }
      function goToDate(date) {
        for (let i = 0; i < windows.length; i++) {
          windows[i].date.setTime(date);
        }
        syncDates();
        refresh();
      }
      
      class DisplayWindow {
        constructor() {
          this.elem = document.createElement('div');
          this.elem.id = 'display-window';
          this.icon = document.getElementById('print-icon');
          this.rows = [];
        }
        
        render() {
          const date = windows[currentTab].date;
          this.rows.length = 0;
          this.elem.innerHTML = '';
          this.elem.className = ['day', 'month', 'year'][currentTab];
          this.icon.style.display = (currentTab == 0) ? 'inline-block' : 'none';
          switch (currentTab) {
            case 0:
              const key = dateStr(date);
              const weekday = dayNames[date.getDay()];
              const dataTable = getData(date);
              addSpan(this.elem, `${dataTable.title}`, 'title');
              addSpan(this.elem, `${weekday} ${key}\n\n`, 'subtitle');
              addSpan(this.elem, `${dataTable.notes ? dataTable.notes + '\n\n' : ''}`, 'subtitle')
              for (let [index, params] of dataTable.schedule.entries()) {
                const [description, location, startTime, endTime, instructors] = params;
                const timeRange = startTime + ' - ' + endTime;
                const row = addDiv(this.elem, 'row');
                this.rows.push(row);
                for (const item of [description, location, timeRange]) {
                  const s = addSpan(row, item);
                  s.style.color = palette[index % palette.length];
                }
              }
              addSpan(this.elem, '', 'title');
              break;
            case 1:
              addSpan(this.elem, 'Events\n\n', 'title');
              const firstDay = startOfMonth(date);
              const lastDay = endOfMonth(date);
              let day = firstDay;
              while (day <= lastDay) {
                const key = dateStr(day);
                if (key in eventData) {
                  const row = addDiv(this.elem, 'row');
                  this.rows.push(row);
                  const {title, category} = eventData[key];
                  const k = addSpan(row, key);
                  const e = addSpan(row, title);
                  k.style.color = categories[category];
                  e.style.color = categories[category];
                  k.style.textAlign = 'right';
                };
                addTime(day, 'day', 1);
              }
              addSpan(this.elem, '', 'title');
              break;
            case 2:
              addSpan(this.elem, 'Legend\n\n', 'title');
              for (const [name, color] of Object.entries(categories)) {
                const row = addDiv(this.elem, 'row');
                this.rows.push(row);
                const c = addDiv(row, 'color-box');
                const n = addSpan(row, name);
                c.style.color = color;
                n.style.color = color;
              }
              addSpan(this.elem, '', 'title');
              break;
          }
        }
      }
      class DayWindow {
        constructor() {
          this.date = new Date();
          this.elem = document.createElement('div');
          this.elem.id = 'day-window';
          this.top = addDiv(this.elem, 'top');
          this.grid = addDiv(this.elem, 'grid');
          addSpan(this.top, 'Time', 'first-header');
          this.startHour = 14;
          this.endHour = 21;
          this.buildGridRows();
          this.events = []
        }
        
        buildGridRows() {
          this.grid.innerHTML = '';
          let time = new Date();
          time.setHours(this.startHour, 0, 0, 0);
          for (let i=this.startHour; i<=this.endHour; i++) {
            const row = addDiv(this.grid, 'row');
            const headerText = time.toLocaleTimeString('en-US', {
              hour: 'numeric',
              hour12: true,
            }).toLowerCase();
            const s = addSpan(row, headerText, 'side-header');
            const color = ((i-this.startHour) % 2 == 0) ? 'lightgray' : 'white';
            row.style.backgroundColor = color;
            time.setHours(time.getHours() + 1);
          }
        }
        
        onEnter() {
          const title = document.querySelector('#window-banner .header .title-text');
          title.innerText = dateStr(this.date, {day:'numeric', month:'long', year:'numeric'});
          this.render();
          this.intervalUpdate();
          this.intervalID = setInterval(() => this.intervalUpdate(), 1000);
        }
        
        onExit() {
          clearInterval(this.intervalID);
        }
        
        intervalUpdate() {
          const now = new Date();
          this.timeDiv.style.display = 'none';
          if (dateStr(this.date) == dateStr(now)) {
            const time = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600
            const offset = time - this.startHour;
            const rowCount = this.endHour - this.startHour + 1;
            if (offset >= 0 && offset <= rowCount) {
              this.timeDiv.style.display = 'block'
              this.timeDivText.innerText = now.toLocaleTimeString();
              this.timeDiv.style.bottom = `${94*(1 - offset/rowCount)}%`
            }
          }
        }
        
        render() {
          const grid = this.elem.querySelector('.grid');
          const rows = grid.children;
          const dataTable = getData(this.date);
          this.top.innerHTML = this.top.children[0].outerHTML;
          this.grid.innerHTML = '';
          this.events.length = 0;
          [this.startHour, this.endHour] = [14, 21];
          const locations = [];
          for (const [name, location, start, end] of dataTable.schedule) {
            this.startHour = Math.floor(Math.min(this.startHour, strToHours(start)));
            this.endHour = Math.ceil(Math.max(this.endHour, strToHours(end)));
          }
          const count = this.endHour - this.startHour + 1;
          this.buildGridRows();
          for (let [i, [name, location, start, end]] of dataTable.schedule.entries()) {
            let index = locations.indexOf(location) + 1;
            if (index == 0) {
              index = locations.length + 1;
              locations.push(location);
              const header = addSpan(this.top, location, 'header');
              header.style.left = `${15*index-6}%`;
            }
            const block = addDiv(rows[0], 'event');
            this.events.push(block);
            [start, end] = [start, end].map(strToHours);
            const offset = start - this.startHour;
            const duration = end - start;
            block.style.top = `${6+94*offset/count}%`;
            block.style.left = `${15*index-6}%`
            block.style.height = `${94*duration/count}%`;
            block.style.backgroundColor = palette[i % palette.length];
            block.innerText = name;
          }
          this.timeDiv = addDiv(rows[0], 'current-time');
          this.timeDivText = addSpan(this.timeDiv, '');
        }
      }
      class MonthWindow {
        constructor() {
          this.date = new Date();
          this.selected = new Date();
          this.elem = document.createElement('div');
          this.elem.id = 'month-window';
          this.events = [];
          const dayHeader = addDiv(this.elem, 'day-header');
          const grid = addDiv(this.elem, 'grid');
          for (const name of dayNames) {
            addSpan(dayHeader, name, 'day-header-item');
          }
          for (let i = 0; i < 42; i++) {
            const box = addDiv(grid, 'box');
            const dateText = addDiv(box, 'date');
            const nameText = addDiv(box, 'name');
          }
        }
        
        onEnter() {
          const title = document.querySelector('#window-banner .header .title-text');
          title.innerText = dateStr(this.date, {month:'long', year:'numeric'});
          this.render();
        }
        
        onExit() {}
        
        render() {
          const grid = this.elem.querySelector('.grid');
          const firstDayOfMonth = startOfMonth(this.date);
          const lastDayOfMonth = endOfMonth(this.date);
          const today = dateStr(new Date());
          const selected = dateStr(this.selected);
          this.events.length = 0;
          let day = startOfWeek(firstDayOfMonth);
          for (let i = 0; i < 42; i++) {
            const box = grid.children[i];
            const dateText = box.querySelector('.date');
            const nameText = box.querySelector('.name');
            const isActive = day >= firstDayOfMonth && day <= lastDayOfMonth;
            box.classList.toggle('inactive', !isActive);
            dateText.innerText = day.getDate();
            const key = dateStr(day);
            box.classList.toggle('today', isActive && key==today);
            box.classList.toggle('selected', isActive && key==selected);
            if (key in eventData && isActive) {
              this.events.push(box);
              const {title, category} = eventData[key];
              nameText.innerText = title;
              box.style.backgroundColor = categories[category];
            } else {
              nameText.innerText = '';
              box.style.backgroundColor = '';
            }
            addTime(day, 'day', 1);
          }
        }
      }
      class YearWindow {
        constructor(monthOffset = 0) {
          this.monthOffset = monthOffset;
          this.date = new Date();
          this.selected = new Date();
          this.groups = {};
          this.elem = document.createElement('div');
          this.elem.id = 'year-window';
          const grid = addDiv(this.elem, 'grid');
          for (let i = 0; i < 12; i++) {
            const month = addDiv(grid, 'month');
            const banner = addDiv(month, 'banner');
            const mgrid = addDiv(month, 'mgrid');
            for (let j = 0; j < 7; j++) addSpan(mgrid, dayNames[j][0], 'day-name');
            for (let j = 0; j < 42; j++) addDiv(mgrid, 'date');
          }
        }
        
        onEnter() {
          const title = document.querySelector('#window-banner .header .title-text');
          if (this.monthOffset == 0) {
            title.innerText = dateStr(this.date, {year: 'numeric'});
          } else {
            let year = this.date.getFullYear();
            if (this.date.getMonth() < this.monthOffset) year--;
            title.innerText = `${year} - ${year+1}`;
          }
          this.render();
        }
        
        onExit() {}
        
        getFirstDay() {
          let year = this.date.getFullYear();
          if (this.date.getMonth() < this.monthOffset) year--;
          return new Date(year, this.monthOffset, 1);
        }
        
        render() {
          const grid = this.elem.querySelector('.grid');
          for (const key in this.groups) delete this.groups[key];
          let year = this.date.getFullYear();
          if (this.date.getMonth() < this.monthOffset) year--;
          for (let i = 0; i < 12; i++) {
            const month = new Date(year, i + this.monthOffset, 1);
            const monthBox = grid.children[i];
            const banner = monthBox.querySelector('.banner');
            const monthGrid = monthBox.querySelector('.mgrid');
            const firstDay = startOfMonth(month);
            const lastDay = endOfMonth(month);
            const today = dateStr(new Date());
            const selected = dateStr(this.selected);
            banner.innerText = month.toLocaleString('en-US', {month:'long', year:'numeric'});
            for (let j = 0; j < 7; j++) {
              monthGrid.children[j].innerText = dayNames[j][0];
            }
            let day = startOfWeek(firstDay);
            for (let j = 0; j < 42; j++) {
              const box = monthGrid.children[7 + j];
              const withinMonth = firstDay <= day && day <= lastDay;
              if (withinMonth) {
                box.innerText = day.getDate();
                const key = dateStr(day);
                if (key in eventData) {
                  const {title, category} = eventData[key];
                  if (category in this.groups)
                    this.groups[category].push(box);
                  else
                    this.groups[category] = [box];
                  box.style.backgroundColor = categories[category];
                } else {
                  box.style.backgroundColor = '';
                }
                box.classList.toggle('today', key==today);
                box.classList.toggle('selected', key==selected);
              } else {
                box.innerText = '';
                box.style.backgroundColor = '';
                box.classList.toggle('today', false);
                box.classList.toggle('selected', false);
              }
              addTime(day, 'day', 1);
            }
          }
        }
      }
      class HoverLinker {
        constructor() {
          this.controller = new AbortController();
          this.links = []
        }
        
        link(...elems) {
          this.links.push(elems);
          const index = this.links.length-1;
          for (const elem of elems) {
            elem.addEventListener('mouseenter', () => this.setAll(index, true), {signal: this.controller.signal});
            elem.addEventListener('mouseleave', () => this.setAll(index, false), {signal: this.controller.signal});
          };
        }
        
        linkFirst(...elems) {
          this.links.push(elems);
          const index = this.links.length-1;
          elems[0].addEventListener('mouseenter', () => this.setAll(index, true), {signal: this.controller.signal});
          elems[0].addEventListener('mouseleave', () => this.setAll(index, false), {signal: this.controller.signal});
          for (const elem of elems.slice(1)) {
            elem.addEventListener('mouseenter', () => this.setFirst(index, true), {signal: this.controller.signal});
            elem.addEventListener('mouseleave', () => this.setFirst(index, false), {signal: this.controller.signal});
          }
        }
        
        setAll(index, bool) {
          for (const elem of this.links[index]) {
            elem.classList.toggle('isHovering', bool);
          };
        }
        
        setFirst(index, bool) {
          this.links[index][0].classList.toggle('isHovering', bool);
        }
        
        abort() {
          for (let i = 0; i < this.links.length; i++) {
            this.setAll(i, false);
          }
          this.links.length = 0;
          this.controller.abort();
          this.controller = new AbortController();
        }
      }
      
      const hoverLinker = new HoverLinker();
      const displayObj = new DisplayWindow();
      const windows = [new DayWindow(), new MonthWindow(), new YearWindow(6)];
      windows[2].elem.addEventListener('click', event => {
        const elem = event.target;
        const day = windows[2].getFirstDay();
        if (elem.classList.contains('date')) {
          addTime(day, 'month', getElemIndex(elem, 3));
          addTime(day, 'day', -day.getDay());
          addTime(day, 'day', getElemIndex(elem, 1) - 7);
          windows[0].date.setTime(day.getTime());
          selectTab(0);
        } else if (elem.classList.contains('banner')) {
          addTime(day, 'month', getElemIndex(elem, 2))
          windows[1].date.setTime(day.getTime());
          selectTab(1);
        }
      });
      windows[1].elem.addEventListener('click', event => {
        const elem = event.target;
        const date = startOfWeek(startOfMonth(windows[1].date));
        if (elem.parentElement.classList.contains('box')) {
          addTime(date, 'day', getElemIndex(elem, 2));
          windows[0].date.setTime(date.getTime());
          selectTab(0);
        }
      })
      
      const divider = document.getElementById('divider');
      const section1 = document.getElementById('section-1');
      const section2 = document.getElementById('section-2');
      const main = document.querySelector('main');
      divider.addEventListener('pointerdown', event => {
        const controller = new AbortController();
        const isPortrait = window.matchMedia("(orientation: portrait)").matches;
        if (isPortrait) {
          window.addEventListener('pointermove', event => {
            let ypercent = Math.round(100 * (event.clientY + 5) / window.innerHeight);
            main.style.cursor = 'row-resize';
            divider.style.top = `calc(${ypercent}% - 10px)`;
            section1.style.height = `${ypercent}%`;
            section2.style.height = `${100 - ypercent}%`;
          }, {signal: controller.signal});
        } else {
          window.addEventListener('pointermove', event => {
            let xpercent = Math.round(100 * (event.clientX + 5) / window.innerWidth);
            main.style.cursor = 'col-resize';
            divider.style.left = `calc(${xpercent}% - 10px)`;
            section1.style.width = `${xpercent}%`;
            section2.style.width = `${100 - xpercent}%`;
          }, {signal: controller.signal});
        }
        window.addEventListener('pointerup', event => {
          main.style.removeProperty("cursor");
          controller.abort();
        }, {signal: controller.signal});
      })
      
      const mediaQuery = window.matchMedia('(orientation: portrait)');
      mediaQuery.addEventListener('change', (event) => {
        section1.style.removeProperty('width');
        section1.style.removeProperty('height');
        section2.style.removeProperty('width');
        section2.style.removeProperty('height');
        divider.style.removeProperty('top');
        divider.style.removeProperty('left');
      });
      
      document.getElementById('display').append(displayObj.elem);
      document.getElementById('windows').append(...windows.map(w => w.elem));
      const eventData = parseDataPage(getStored('eventData'));
      const weeklyData = parseWeekPage(getStored('weekData'));
      const categories = parseCategoryPage(getStored('categoryData'));
      let currentTab = Number(getStored('currentTab', 1));
      selectTab(currentTab);
      fetchData(
        'https://docs.google.com/spreadsheets/d/1G4BoG5Jumb-N_HVgcvb5e1noY3rL4GG_F5kfpcgIl6s/export?format=csv&gid=0',
        'https://docs.google.com/spreadsheets/d/1G4BoG5Jumb-N_HVgcvb5e1noY3rL4GG_F5kfpcgIl6s/export?format=csv&gid=1592630584',
        'https://docs.google.com/spreadsheets/d/1G4BoG5Jumb-N_HVgcvb5e1noY3rL4GG_F5kfpcgIl6s/export?format=csv&gid=1588629629',
      );
    
    </script>
