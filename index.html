<!DOCTYPE html>

<html lang="en">
  <head>
    <title>SWDC Calendar</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Southwest Washington Dance Center (SWDC) calendar and schedule viewer">
    <link rel="preload" as="image" fetchpriority="high" href="https://images.squarespace-cdn.com/content/v1/5fa31a9e206c8a69fd49cfda/1611602029932-VTFLL1ATNQGALUG35LPA/png.png">
    <style>
      * {
        margin: 0;
        min-width: 0;
        min-height: 0;
        font-family: sans-serif;
        box-sizing: border-box;
        user-select: none;
      }
      :root {
        height: 100%;
        background-color: var(--bg-color-2);
        -webkit-tap-highlight-color: transparent;
        --bg-color-1: #232037;
        --bg-color-2: #1b1b1b;
        --font-size-0: 0.8cqw;
        --font-size-1: 1cqw;
        --font-size-2: 1.25cqw;
        --font-size-3: 1.5cqw;
        --font-size-4: 2cqw;
        --font-size-5: 3cqw;
        --logo-height: 20vh;
        --copy-height: 4vh;
      }
      body {
        height: 100%;
      }
      main {
        display: flex;
        width: 100%;
        height: 100%;
      }
      .divider {
        position: absolute;
        z-index: 1;
        touch-action: none;
      }
      .alert-message {
        z-index: 1;
        color: white;
        background-color: var(--bg-color-2);
        position: fixed;
        top: 100%;
        left: 50%;
        padding: 4px 10px;
        border-radius: 6px;
        animation: slideIn 0.3s ease forwards;
        pointer-events: none;
      }
      @keyframes slideIn {
        from {transform: translate(-50%)}
        to {transform: translate(-50%, -200%)}
      }
      #section-1 {
        position: relative;
        width: 41%;
        height: 100%;
        background-image: linear-gradient(to right, var(--bg-color-1), var(--bg-color-2));
      }
      #logo {
        padding: 10px;
        height: var(--logo-height);
        background-image: url('https://images.squarespace-cdn.com/content/v1/5fa31a9e206c8a69fd49cfda/1611602029932-VTFLL1ATNQGALUG35LPA/png.png');
        background-size: contain;
        background-origin: content-box;
        background-position: center;
        background-repeat: no-repeat;
      }
      #display {
        position: relative;
        text-align: center;
        height: calc(100% - var(--logo-height) - 20px - var(--copy-height));
        margin: 10px;
        border: 1px solid gray;
        border-radius: 6px;
        overflow: auto;
        scrollbar-color: white #1d1c1f;
      }
      #display-icons {
        display: flex;
        position: absolute;
        right: 0;
      }
      #display-icons svg {
        cursor: pointer;
        margin: 6px;
        width: 24px;
      }
      #display-window {
        display: inline-grid;
        max-height: 100%;
        text-align: left;
        font-size: var(--font-size-1);
        padding: 15px 10px;
      }
      #display-window .row {
        display: contents;
        cursor: default;
      }
      #display-window .row.isHovering span {
        text-shadow: 0px 0px 5px currentColor;
      }
      #display-window .row.isHovering .color-box {
        box-shadow: 0px 0px 5px currentColor;
      }
      #display-window .title,
      #display-window .subtitle {
        grid-column: 1 / -1;
        text-align: center;
        text-wrap: balance;
      }
      #display-window .title {
        padding: 0.5em 0.8em 0em 0.8em;
        color: white;
        font-size: var(--font-size-3);
      }
      #display-window .subtitle {
        padding: 1em 0.8em;
        color: lightgray;
        font-size: var(--font-size-1);
      }
      #display-window span {
        padding: 0.5em 0.8em;
      }
      #display-window.day {
        grid-template-columns: fit-content(40%) max-content max-content 1fr;
        text-wrap: balance;
      }
      #display-window.month,
      #display-window.year {
        grid-template-columns: max-content 1fr;
      }
      #display-window.year .color-box {
        aspect-ratio: 1;
        margin: 5px;
        background-color: currentColor;
      }
      #attribution {
        color: lightgray;
        width: 100%;
        height: var(--copy-height);
        text-align: center;
        font-size: var(--font-size-0);
      }
      #section-2 {
        position: relative;
        width: 59%;
        height: 100%;
      }
      #window-banner {
        display: flex;
        position: relative;
        background-image: linear-gradient(to bottom, white, lightgray);
        justify-content: space-between;
        align-items: center;
        height: 10%;
        padding: 0 10px;
        text-align: center;
        font-weight: bold;
        font-size: var(--font-size-4);
      }
      #window-banner .radio-buttons {
        display: inline-grid;
        grid-template-columns: repeat(3, max-content);
        gap: 4px;
      }
      #window-banner .button {
        color: black;
        cursor: pointer;
        font-size: var(--font-size-2);
        font-weight: bold;
        border: 1px solid gray;
        border-radius: 6px;
        box-shadow: 2px 2px 1px gray;
        transform: translate(-2px, -2px);
        background-image: linear-gradient(to bottom, white, lightgray);
        padding: 5px;
      }
      #window-banner .button:hover {
        box-shadow: 2px 2px 1px black;
      }
      #window-banner .button:active,
      #window-banner .button.selected {
        transform: none;
        box-shadow: inset 1px 1px 1px gray;
        background-image: linear-gradient(to bottom, lightgray, white);
      }
      #window-banner .header {
        display: flex;
        position: absolute;
        left: 50%;
        width: 33%;
        transform: translate(-50%, 0);
        justify-content: space-between;
        align-items: center;
      }
      #window-banner .header .nav-btn {
        font-size: var(--font-size-5);
        transform: translate(0, -7%);
      }
      #window-banner .header .nav-btn:hover {
        cursor: pointer;
        text-shadow: 0 0 2px gray;
      }
      #windows {
        position: absolute;
        width: 100%;
        height: 90%;
      }
      #day-window {
        height: 100%;
        display: none;
      }
      #day-window.selected {
        display: block;
      }
      #day-window .top {
        height: 6%;
        font-size: var(--font-size-2);
        font-weight: bold;
        align-content: center;
        background-image: linear-gradient(to bottom, lightcyan, lightblue);
      }
      #day-window .top .header {
        display: inline-block;
        position: absolute;
        text-align: center;
        width: 15%;
      }
      #day-window .top .first-header {
        display: inline-block;
        text-align: right;
        width: 7%;
      }
      #day-window .bottom {
        position: relative;
        height: 94%;
        font-size: var(--font-size-2);
      }
      #day-window .grid {
        display: grid;
        height: 100%;
        grid-template-columns: 1fr;
      }
      #day-window .grid .row {
        align-content: center;
      }
      #day-window .grid .side-header {
        display: inline-block;
        text-align: right;
        white-space: nowrap;
        width: 7%;
      }
      #day-window .bottom .event {
        display: inline-block;
        position: absolute;
        text-align: center;
        text-wrap: balance;
        align-content: center;
        overflow: scroll;
        scrollbar-width: none;
        border: 1px solid #FFFFFF00;
        border-radius: 6px;
        width: 15%;
        padding: 0px 6px;
      }
      #day-window .bottom .event.isHovering {
        box-shadow: 1px 1px 3px black;
        border: 1px solid black;
        z-index: 1;
      }
      #day-window .bottom .time-indicator {
        position: absolute;
        width: 100%;
        height: 0px;
        border: 1px dashed black;
        text-align: right;
        pointer-events: none;
        z-index: 2;
      }
      #day-window .bottom .time-indicator span {
        position: absolute;
        transform: translate(-100%, -100%);
        text-wrap: nowrap;
      }
      #month-window {
        display: none;
        height: 100%;
      }
      #month-window.selected {
        display: block;
      }
      #month-window .day-header {
        display: grid;
        height: 5%;
        grid-template-columns: repeat(7, 1fr);
      }
      #month-window .day-header-item {
        align-content: center;
        text-align: center;
        font-size: var(--font-size-1);
        background-image: linear-gradient(to bottom, lightcyan, lightblue);
        border: 1px solid lightgray;
        padding: 2px;
      }
      #month-window .grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        grid-template-rows: repeat(6, 1fr);
        height: 95%;
      }
      #month-window .grid .box {
        position: relative;
        padding: 4px;
        border: 1px solid lightgray;
        background-color: white;
        font-size: var(--font-size-1);
      }
      #month-window .grid .box .date {
        position: absolute;
      }
      #month-window .grid .box .name {
        width: 100%;
        height: 100%;
        text-align: center;
        align-content: center;
      }
      #month-window .grid .box.inactive {
        color: #888;
        background-color: #ccc;
      }
      #month-window .grid .box:hover,
      #month-window .grid .box.isHovering {
        cursor: pointer;
        box-shadow: 1px 1px 3px black;
        border: 1px solid black;
        z-index: 1;
      }
      #month-window .grid .box.selected {
        border: 1px solid black;
      }
      #month-window .grid .box.today {
        border: 2px solid black;
      }
      #month-window .grid .box.today .date {
        font-weight: bold;
      }
      #year-window {
        display: none;
        height: 100%;
        background-color: lightgray;
      }
      #year-window.selected {
        display: block;
      }
      #year-window .grid {
        display: grid;
        margin-left: auto;
        height: 100%;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 1fr);
        padding: 3px;
        gap: 3px;
      }
      #year-window .grid .month {
        border: 1px solid black;
        box-shadow: 1px 1px 2px black;
      }
      #year-window .grid .month:hover {
        box-shadow: 1px 1px 5px black;
        cursor: pointer;
      }
      #year-window .grid .month .banner {
        font-size: var(--font-size-1);
        font-weight: bold;
        text-align: center;
        align-content: center;
        background-image: linear-gradient(to bottom, white, lightgray);
        height: 10%;
      }
      #year-window .grid .month .mgrid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        grid-template-rows: repeat(7, 1fr);
        font-size: var(--font-size-1);
        text-align: center;
        height: 90%;
      }
      #year-window .grid .month .mgrid .day-name {
        background-image: linear-gradient(to bottom, lightcyan, lightblue);
        border: 1px solid lightgray;
        align-content: center;
      }
      #year-window .grid .month .mgrid .date {
        position: relative;
        background-color: white;
        border: 1px solid lightgray;
        align-content: center;
      }
      #year-window .grid .month .mgrid .date.isHovering {
        box-shadow: 1px 1px 2px black;
        z-index: 1;
      }
      #year-window .grid .month .mgrid .date:hover,
      #year-window .grid .month .mgrid .date.selected {
        cursor: pointer;
        border: 1px solid black;
      }
      #year-window .grid .month .mgrid .date.selected:hover {
        cursor: pointer;
        border: 2px solid black;
      }
      #year-window .grid .month .mgrid .date.today {
        border: 2px solid black;
        font-weight: bold;
      }
      #year-window .grid .month .mgrid .date.today:hover {
        border: 3px solid black;
      }
      #print-container {
        display: none;
        width: 100%;
        text-align: center;
        text-wrap: balance;
        margin: 0;
      }
      #print-container .title {
        font-size: 28px;
        font-weight: bold;
        padding: 5px;
      }
      #print-container .subtitle {
        font-size: 20px;
      }
      #print-container .notes {
        font-size: 16px;
        padding: 20px;
      }
      #print-container table {
        display: inline-block;
        text-align: left;
        font-size: 16px;
        border-collapse: collapse;
      }
      #print-container th, #print-container td {
        border: 1px solid black;
        padding: 10px;
      }
      #print-container th {
        text-wrap: nowrap;
      }
      @media (orientation: portrait) {
        :root {
          --font-size-0: 0.8cqh;
          --font-size-1: 1cqh;
          --font-size-2: 1.25cqh;
          --font-size-3: 1.5cqh;
          --font-size-4: 2cqh;
          --font-size-5: 3cqh;
          --logo-height: 10vh;
          --copy-height: 2vh;
        }
        main {display: block;}
        #section-1 {width: 100%; height: 50%;}
        #section-2 {width: 100%; height: 50%;}
      }
      @media print {
        :root {background-color: transparent;}
        main {display: none;}
        #print-container {display: block;}
      }
    </style>
  </head>
  
  <body>
    
    <main>
      <div id="section-1">
        <a href="https://www.swwdance.org/" aria-label="SWDC Homepage">
          <div id="logo"></div>
        </a>
        <div id="display">
          <div id="display-icons">
            <svg id="print-icon" onclick="printSchedule()" xmlns="http://w3.org" viewBox="0 0 24 24" fill="lightgray" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 10h16a2 2 0 012 2v5a2 2 0 01-2 2H4a2 2 0 01-2-2v-5a2 2 0 012-2z"/>
              <path d="M18 10V4a1 1 0 00-1-1H7a1 1 0 00-1 1v6M6 16h12v6H6z"/>
              <circle cx="18" cy="13" r="1" fill="currentColor"/>
            </svg>
            <svg id="copy-icon" onclick="copySchedule()" xmlns="http://w3.org" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="3" width="12" height="13" rx="2" fill="gray" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <rect x="3" y="8" width="12" height="13" rx="2" fill="lightgray" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div id="display-window"></div>
        </div>
        <div id="attribution">
          &#169; 2026 Matthew Damian.  Calendar website design and code.  SWDC&trade;
        </div>
      </div>
      
      <div id="section-2">
        <div id="window-banner">
          <div class="radio-buttons">
            <div class="button">Day</div>
            <div class="button">Month</div>
            <div class="button">Year</div>
          </div>
          <div class="header">
            <div onclick="navigate(-1)" class="nav-btn">‹</div>
            <div class="title-text"></div>
            <div onclick="navigate(1)" class="nav-btn">›</div>
          </div>
          <div onclick="goToDate(Date.now())" class="button">Today</div>
        </div>
        <div id="windows">
          <div id="day-window"></div>
          <div id="month-window"></div>
          <div id="year-window"></div>
        </div>
      </div>
    </main>
    
    <div id="print-container">
    </div>
    
    <script>
      
      // Pure/Inspector Functions (write:none)
      
      function clamp(num, min, max) {
        return Math.min(Math.max(num, min), max);
      }
      function getRelativeCoords(target) {
        const rect = target.getBoundingClientRect();
        const prect = target.parent.getBoundingClientRect();
        return {x: rect.x - prect.x, y: rect.y - prect.y};
      }
      function isValidNumber(str) {
        return str.trim() !== "" && !isNaN(Number(str));
      }
      function isValidDate(dateStr) {
        return !isNaN(new Date(dateStr).getTime());
      }
      function toDateStr(date) {
        return [date.getMonth() + 1, date.getDate(), date.getFullYear()].join('/');
      }
      function dateArray(dateRangeStr, step=1) {
        let [s, e] = dateRangeStr.split('-');
        if (!e) return [s];
        const result = [];
        s = new Date(s);
        e = new Date(e);
        while (s <= e) {
          result.push(toDateStr(s));
          addTime(s, 'day', step);
        }
        return result;
      }
      function titleCase(text) {
        return text.trim().toLowerCase().replace(/\b(?<!')\w/g, char => char.toUpperCase());
      }
      function startOfMonth(day) {
        return new Date(day.getFullYear(), day.getMonth(), 1)
      }
      function endOfMonth(day) {
        return new Date(day.getFullYear(), day.getMonth() + 1, 0)
      }
      function startOfWeek(day) {
        return new Date(day.getFullYear(), day.getMonth(), day.getDate() - day.getDay())
      }
      function parseTime(timeString) {
        const timeRegex = /^(?<hours>0?[1-9]|1[0-2]):(?<minutes>[0-5]\d)(?::(?<seconds>[0-5]\d))?\s?(?<meridian>[AaPp][Mm])$/;
        const match = timeRegex.exec(timeString.trim());
        if (!match) return null;
        const {hours, minutes, seconds, meridian} = match.groups;
        return {
          hours: Number(hours),
          minutes: Number(minutes),
          seconds: Number(seconds || 0),
          meridian: meridian.toLowerCase(),
        };
      }
      function strToHours(timeString) {
        const match = parseTime(timeString);
        if (!match) return null;
        let {hours, minutes, seconds, meridian} = match;
        if (hours === 12) hours = 0;
        if (meridian === 'pm') hours += 12;
        return hours + minutes/60 + seconds/3600;
      }
      function getElemIndex(target, depth=1) {
        let parent = target.parentElement;
        let child = target;
        for (let i = 1; i < depth; i++) {
          child = parent;
          parent = child.parentElement;
        }
        return [...parent.children].indexOf(child);
      }
      function csvLineToArray(s) {
        let array = [];
        for (const match of s.matchAll(/(".*?"),?|([^"]+)/g)) {
          if (match[1] === undefined) {
            array.push(...match[2].replace(/,$/g, '').split(','));
          } else {
            array.push(match[1].replace(/^"|"$/g, ''));
          }
        }
        return array;
      }
      function csvLines(text) {
        return {
          matches: text.matchAll(/^.*\r?$/gm),
          next() {
            while (true) {
              const match = this.matches.next();
              if (match.done === true) return match;
              const line = match.value[0].trim();
              if (line.startsWith('#')) continue;
              const contents = csvLineToArray(line);
              if (contents.some(s => s !== '')) {
                return {value: contents, done: false};
              };
            }
          },
          [Symbol.iterator]() {return this},
        }
      }
      function parseCategoryPage(data) {
        const result = {};
        for (const [name, color] of csvLines(data)) {
          result[titleCase(name)] = color;
        }
        return result
      }
      function parseDataPage(data) {
        let date;
        const result = {};
        for (const [first, ...rest] of csvLines(data)) {
          if (first !== '') {
            date = first;
            let [title, categories, notes] = rest;
            title = titleCase(title);
            categories = titleCase(categories).split(',').map(s => s.trim());
            for (const d of dateArray(date)) {
              addEntry(result, d, title, [], categories, notes);
            }
          } else {
            const entry = rest;
            while (entry.length < 5) entry.push('');
            result[date].schedule.push(entry);
          }
        }
        return result;
      }
      function parseWeekPage(data) {
        const result = []
        let day;
        for (const [first, ...rest] of csvLines(data)) {
          const identifier = titleCase(first);
          if (identifier === 'Duration') {
            const [startDate, endDate] = rest;
            result.push({startDate: new Date(startDate), endDate: new Date(endDate)})
            continue;
          }
          if (result.length === 0) continue;
          const lastEntry = result.at(-1);
          if (dayNames.includes(identifier)) {
            day = identifier;
            lastEntry[day] = [];
          }
          if (day in lastEntry) {
            lastEntry[day].push(rest);
          };
        }
        return result;
      }
      function getData(key) {
        if (key in eventData) return eventData[key];
        return {title: '', schedule: [], categories: [], notes: ''};
      }
      
      // Mutators (write:inner)
      
      function addTime(date, mode, amount) {
        let month;
        switch (mode.toLowerCase()) {
          case 'year':
            month = date.getMonth();
            date.setFullYear(date.getFullYear() + amount);
            if (date.getMonth() != month) date.setMonth(date.getMonth(), 0);
            break;
          case 'month':
            month = date.getMonth() + amount;
            date.setMonth(month);
            if (month < 0) month += 12;
            if (date.getMonth() % 12 != month % 12) date.setMonth(date.getMonth(), 0);
            break;
          case 'day':
            date.setDate(date.getDate() + amount);
            break;
        }
      }
      function addElem(elem, tag, ...classes) {
        const newElem = document.createElement(tag);
        newElem.classList.add(...classes);
        elem.appendChild(newElem);
        return newElem;
      }
      function addDiv(elem, ...classes) {
        return addElem(elem, 'div', ...classes);
      }
      function addSpan(elem, text, ...classes) {
        const newElem = document.createElement('span');
        newElem.classList.add(...classes);
        elem.appendChild(newElem);
        newElem.innerText = text;
        return newElem;
      }
      function selectFrom(nodes, index) {
        for (const [i, n] of [...nodes].entries()) {
          n.classList.toggle('selected', i === index);
        }
      }
      function objSet(obj, newObj) {
        for (const key in obj) delete obj[key];
        Object.assign(obj, newObj);
      }
      function addEntry(data, key, title, schedule, categories, notes) {
        const sorted = [...schedule];
        sorted.sort((a,b) => a[1] - b[1]); // sort by location name
        sorted.sort((a,b) => strToHours(a[2]) - strToHours(b[2])); // sort by start time
        const entry = {
          title: title,
          schedule: sorted,
          categories: categories,
          notes: notes,
        }
        const filter = array => {
          if (array.length <= 1) {
            return array.filter(item => item !== null);
          } else {
            return array.filter(item => item !== null && item != 'Classes')
          }
        }
        if (key in data) {
          const entry2 = data[key];
          entry.title = filter([entry2.title, entry.title]).join('\n');
          entry.schedule = [...entry2.schedule, ...entry.schedule];
          entry.categories = filter([...entry2.categories, ...entry.categories]);
          entry.notes = entry2.notes ? [entry2.notes, entry.notes].join('\n') : entry.notes;
        }
        data[key] = entry;
      }
      function addWeeklyData(data, weeklyData) {
        for (const entry of weeklyData) {
          const s = new Date(entry.startDate);
          while (s <= entry.endDate) {
            dayName = dayNames[s.getDay()];
            const key = toDateStr(s);
            if (dayName in entry && !getData(key).categories.includes('No Class')) {
              addEntry(data, key, 'Classes', entry[dayName], ['Classes'], '');
            }
            addTime(s, 'day', 1);
          }
        }
      }
      function addToArrayMap(data, key, value) {
        if (key in data) {
          data[key].push(value)
        } else {
          data[key] = [value];
        }
      }
      
      // Macros (write:outer)
      
      function fetchData(sheetsURL, gidMap) {
        const urls = {};
        for (const [name, gid] of Object.entries(gidMap)) {
          urls[name] = `${sheetsURL}/export?format=csv&gid=${gid}`
        }
        const promises = [
          fetch(urls.events).then(response => response.ok ? response.text() : null),
          fetch(urls.weekly).then(response => response.ok ? response.text() : null),
          fetch(urls.colors).then(response => response.ok ? response.text() : null),
        ]
        Promise.all(promises).then(data => {
          if (!data.every(Boolean)) return;
          objSet(eventData, parseDataPage(data[0]));
          addWeeklyData(eventData, parseWeekPage(data[1]));
          objSet(categoryData, parseCategoryPage(data[2]));
          refresh();
          localStorage.setItem('eventData', data[0]);
          localStorage.setItem('weekData', data[1]);
          localStorage.setItem('categoryData', data[2]);
        });
      }
      function printSchedule() {
        const container = document.getElementById('print-container');
        container.innerHTML = '';
        const title = addDiv(container, 'title');
        const subtitle = addDiv(container, 'subtitle');
        const notes = addDiv(container, 'notes');
        const table = addElem(container, 'table');
        const thead = addElem(table, 'thead');
        const tbody = addElem(table, 'tbody');
        const w = windows[0];
        const key = toDateStr(w.date);
        const weekday = dayNames[w.date.getDay()];
        let dataTable = getData(key);
        title.innerText = dataTable.title;
        subtitle.innerText = `${weekday} ${key}`;
        notes.innerText = `${dataTable.notes}`;
        const header = addElem(thead, 'tr');
        for (const text of ['Description', 'Location', 'Start Time', 'End Time', 'Instructors']) {
          const elem = addElem(header, 'th');
          elem.innerText = text;
        }
        for (const items of dataTable.schedule) {
          const row = addElem(tbody, 'tr');
          for (let i = 0; i < 5; i++) {
            let item = items[i];
            if (item === undefined) item = '';
            const elem = addElem(row, 'td');
            elem.innerText = item;
          }
        }
        window.print();
      }
      function copySchedule() {
        const key = toDateStr(windows[0].date);
        const schedule = getData(key).schedule.map(row => row.join('\t'));
        try {
          navigator.clipboard.writeText(schedule.join('\n'))
            .then(() => alert('Copied to Clipboard', 2000));
        } catch {
          alert('Error copying to Clipboard', 2000);
        }
      }
      function alert(message, duration) {
        const main = document.querySelector('main');
        const messageBox = addDiv(main, 'alert-message');
        messageBox.innerText = message;
        setTimeout(() => messageBox.remove(), duration);
      }
      function syncDates() {
        const time0 = windows[0].date.getTime();
        const time = windows[currentTab].date.getTime();
        for (let i = currentTab + 1; i < windows.length; i++) {
          windows[i].date.setTime(time);
        };
        for (const w of windows.slice(1)) {
          w.selected.setTime(time0);
        };
        sessionStorage.setItem('currentDate', windows[0].date);
      }
      function selectTab(index) {
        selectFrom(document.querySelector('#window-banner .radio-buttons').children, index);
        selectFrom(document.querySelector('#windows').children, index);
        currentTab = index;
        refresh();
        displayIcons.style.display = (currentTab === 0) ? 'block' : 'none';
        localStorage.setItem('currentTab', index);
      }
      function refresh() {
        const w = windows[currentTab];
        w.render();
        displayWindow.render();
        // Link hover events
        hoverLinker.abort();
        const rows = displayWindow.rows;
        if (currentTab === 0 || currentTab === 1) {
          for (let i = 0; i < rows.length; i++) {
            hoverLinker.link(rows[i], w.events[i]);
          }
        } else if (currentTab === 2) {
          for (let i = 0; i < rows.length; i++) {
            const category = rows[i].querySelector('span').innerText;
            hoverLinker.linkFirst(rows[i], w.groups[category]);
          }
        }
        // Link date banner
        if (currentTab === 0) {
          title.innerText = w.date.toLocaleDateString('en-us', {day:'numeric', month:'long', year:'numeric'})
        } else if (currentTab === 1) {
          title.innerText = w.date.toLocaleDateString('en-us', {month:'long', year:'numeric'});
        } else if (currentTab === 2) {
          if (w.monthOffset === 0) {
            title.innerText = w.date.toLocaleDateString('en-us', {year: 'numeric'});
          } else {
            let year = w.getFirstDay().getFullYear();
            title.innerText = `${year} - ${year+1}`;
          }
        }
      }
      function navigate(amount) {
        const w = windows[currentTab];
        addTime(w.date, ['day', 'month', 'year'][currentTab], amount);
        syncDates();
        refresh();
      }
      function goToDate(date) {
        for (let i = 0; i < windows.length; i++) {
          windows[i].date.setTime(date);
        }
        syncDates();
        refresh();
      }
      
      // Mutator Classes (write:inner)
      
      class DisplayWindow {
        constructor(elem) {
          this.elem = elem;
          this.rows = [];
        }
        
        render() {
          const date = windows[currentTab].date;
          this.rows.length = 0;
          this.elem.innerHTML = '';
          this.elem.className = ['day', 'month', 'year'][currentTab];
          switch (currentTab) {
            case 0:
              const key = toDateStr(date);
              const weekday = dayNames[date.getDay()];
              const dataTable = getData(key);
              addSpan(this.elem, `${dataTable.title}`, 'title');
              addSpan(this.elem, `${weekday} ${key}`, 'subtitle');
              if (dataTable.notes) {
                addSpan(this.elem, dataTable.notes, 'subtitle');
              }
              for (let [i, params] of dataTable.schedule.entries()) {
                const [description, location, startTime, endTime, instructors] = params;
                const timeRange = startTime + ' - ' + endTime;
                const row = addDiv(this.elem, 'row');
                this.rows.push(row);
                if (location === '') {
                  const s = addSpan(row, description, 'subtitle');
                  s.style.color = palette[i % palette.length];
                } else {
                  for (const item of [description, location, timeRange, instructors]) {
                    const s = addSpan(row, item);
                    s.style.color = palette[i % palette.length];
                  }
                }
              }
              addSpan(this.elem, '', 'title');
              break;
            case 1:
              addSpan(this.elem, 'Events\n\n', 'title');
              const firstDay = startOfMonth(date);
              const lastDay = endOfMonth(date);
              let day = firstDay;
              while (day <= lastDay) {
                const key = toDateStr(day);
                addTime(day, 'day', 1);
                if (key in eventData) {
                  const {title, categories} = eventData[key];
                  if (categories.includes('Classes')) continue;
                  const row = addDiv(this.elem, 'row');
                  this.rows.push(row);
                  const k = addSpan(row, key);
                  const e = addSpan(row, title);
                  k.style.color = categoryData[categories[0]];
                  e.style.color = categoryData[categories[0]];
                  k.style.textAlign = 'right';
                };
              }
              addSpan(this.elem, '', 'title');
              break;
            case 2:
              addSpan(this.elem, 'Legend\n\n', 'title');
              for (const [name, color] of Object.entries(categoryData)) {
                const row = addDiv(this.elem, 'row');
                this.rows.push(row);
                const c = addDiv(row, 'color-box');
                const n = addSpan(row, name);
                c.style.color = color;
                n.style.color = color;
              }
              addSpan(this.elem, '', 'title');
              break;
          }
        }
      }
      class DayWindow {
        constructor(elem) {
          this.date = new Date();
          this.elem = elem;
          this.top = addDiv(this.elem, 'top');
          this.bottom = addDiv(this.elem, 'bottom');
          this.grid = addDiv(this.bottom, 'grid');
          addSpan(this.top, 'Time', 'first-header');
          this.startHour = 14;
          this.endHour = 21;
          this.events = [];
          this.timers = {}
        }
        
        addTimer() {
          this.timeDiv = addDiv(this.bottom, 'time-indicator');
          this.timeDivText = addSpan(this.timeDiv, '');
          this.updateTimeDiv();
          if (this.timers.interval) clearInterval(this.timers.interval);
          if (this.timers.timeout) clearTimeout(this.timers.timeout);
          this.timers.timeout = setTimeout(() => {
            this.updateTimeDiv();
            this.timers.interval = setInterval(() => this.updateTimeDiv(), 1000);
          }, 1000 - new Date().getMilliseconds())
        }
        
        updateTimeDiv() {
          const now = new Date();
          let display = 'none'
          if (toDateStr(this.date) === toDateStr(now)) {
            const time = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600
            const offset = time - this.startHour;
            const rowCount = this.endHour - this.startHour + 1;
            if (offset >= 0 && offset <= rowCount) {
              display = 'block';
              this.timeDivText.innerText = now.toLocaleTimeString();
              this.timeDiv.style.bottom = `${100*(1 - offset/rowCount)}%`
            }
          }
          this.timeDiv.style.display = display;
        }
        
        buildGridRows(startHour, endHour) {
          this.grid.innerHTML = '';
          let time = new Date();
          time.setHours(startHour, 0, 0, 0);
          for (let i=startHour; i<=endHour; i++) {
            const row = addDiv(this.grid, 'row');
            const headerText = time.toLocaleTimeString('en-US', {
              hour: 'numeric',
              hour12: true,
            }).toLowerCase();
            const s = addSpan(row, headerText, 'side-header');
            const color = ((i-startHour) % 2 === 0) ? 'lightgray' : 'white';
            row.style.backgroundColor = color;
            time.setHours(time.getHours() + 1);
          }
        }
        
        render() {
          const dataTable = getData(toDateStr(this.date));
          this.top.replaceChildren(this.top.firstElementChild)
          this.bottom.replaceChildren(this.bottom.firstElementChild)
          this.events.length = 0;
          let [startHour, endHour] = [14, 21];
          for (const [name, location, start, end] of dataTable.schedule) {
            if (!start || !end) continue;
            startHour = Math.floor(Math.min(startHour, strToHours(start)));
            endHour = Math.ceil(Math.max(endHour, strToHours(end)));
          }
          this.buildGridRows(startHour, endHour);
          const locations = [];
          const count = endHour - startHour + 1;
          for (let [i, [name, location, start, end]] of dataTable.schedule.entries()) {
            let index = locations.indexOf(location) + 1;
            if (index === 0 && location) {
              index = locations.length + 1;
              locations.push(location);
              const header = addSpan(this.top, location, 'header');
              header.style.left = `${15*index-6}%`;
            }
            const block = addDiv(this.bottom, 'event');
            this.events.push(block);
            if (!location || !start || !end) {
              block.style.display = 'none';
              continue;
            };
            [start, end] = [start, end].map(strToHours);
            const offset = start - startHour;
            const duration = end - start;
            block.style.top = `${100*offset/count}%`;
            block.style.left = `${15*index-6}%`
            block.style.height = `${100*duration/count}%`;
            block.style.backgroundColor = palette[i % palette.length];
            block.innerText = name;
          }
          this.addTimer();
        }
      }
      class MonthWindow {
        constructor(elem) {
          this.date = new Date();
          this.selected = new Date();
          this.elem = elem;
          this.events = [];
          const dayHeader = addDiv(this.elem, 'day-header');
          const grid = addDiv(this.elem, 'grid');
          for (const name of dayNames) {
            addSpan(dayHeader, name, 'day-header-item');
          }
          for (let i = 0; i < 42; i++) {
            const box = addDiv(grid, 'box');
            const dateText = addDiv(box, 'date');
            const nameText = addDiv(box, 'name');
          }
        }
        
        render() {
          const grid = this.elem.querySelector('.grid');
          const firstDayOfMonth = startOfMonth(this.date);
          const lastDayOfMonth = endOfMonth(this.date);
          const today = toDateStr(new Date());
          const selected = toDateStr(this.selected);
          this.events.length = 0;
          let day = startOfWeek(firstDayOfMonth);
          for (let i = 0; i < 42; i++) {
            const box = grid.children[i];
            const dateText = box.querySelector('.date');
            const nameText = box.querySelector('.name');
            const isActive = day >= firstDayOfMonth && day <= lastDayOfMonth;
            box.classList.toggle('inactive', !isActive);
            dateText.innerText = day.getDate();
            const key = toDateStr(day);
            const data = getData(key);
            box.classList.toggle('today', isActive && key==today);
            box.classList.toggle('selected', isActive && key==selected);
            if (data.categories.length > 0 && isActive) {
              if (!data.categories.includes('Classes')) this.events.push(box);
              nameText.innerText = data.title;
              box.style.backgroundColor = categoryData[data.categories[0]];
            } else {
              nameText.innerText = '';
              box.style.backgroundColor = '';
            }
            addTime(day, 'day', 1);
          }
        }
      }
      class YearWindow {
        constructor(elem, monthOffset = 0) {
          this.monthOffset = monthOffset;
          this.date = new Date();
          this.selected = new Date();
          this.groups = {};
          this.elem = elem;
          this.grid = addDiv(this.elem, 'grid');
          for (let i = 0; i < 12; i++) {
            const month = addDiv(this.grid, 'month');
            const banner = addDiv(month, 'banner');
            const mgrid = addDiv(month, 'mgrid');
            for (let j = 0; j < 7; j++) addSpan(mgrid, dayNames[j][0], 'day-name');
            for (let j = 0; j < 42; j++) addDiv(mgrid, 'date');
          }
        }
        
        getFirstDay() {
          let year = this.date.getFullYear();
          if (this.date.getMonth() < this.monthOffset) year--;
          return new Date(year, this.monthOffset, 1);
        }
        
        render() {
          for (const key in this.groups) delete this.groups[key];
          let year = this.date.getFullYear();
          if (this.date.getMonth() < this.monthOffset) year--;
          const today = toDateStr(new Date());
          const selected = toDateStr(this.selected);
          const monthStart = this.getFirstDay();
          for (let i = 0; i < 12; i++) {
            const monthBox = this.grid.children[i];
            const banner = monthBox.querySelector('.banner');
            banner.innerText = monthStart.toLocaleString('en-US', {month:'long', year:'numeric'});
            const monthGrid = monthBox.querySelector('.mgrid');
            const monthEnd = endOfMonth(monthStart);
            const day = startOfWeek(monthStart);
            for (let j = 0; j < 42; j++) {
              const box = monthGrid.children[7 + j];
              if (monthStart <= day && day <= monthEnd) {
                box.innerText = day.getDate();
                const key = toDateStr(day);
                const data = getData(key);
                for (const c of data.categories) {
                  addToArrayMap(this.groups, c, box);
                }
                if (data.categories.length > 0) {
                  box.style.backgroundColor = categoryData[data.categories[0]];
                } else {
                  box.style.backgroundColor = '';
                }
                box.classList.toggle('today', key==today);
                box.classList.toggle('selected', key==selected);
              } else {
                box.innerText = '';
                box.style.backgroundColor = '';
                box.classList.toggle('today', false);
                box.classList.toggle('selected', false);
              }
              addTime(day, 'day', 1);
            }
            addTime(monthStart, 'month', 1);
          }
        }
      }
      class HoverLinker { // Adds isHovering class to linked objects
        constructor() {
          this.controller = new AbortController();
          this.links = []
        }
        
        link(...elems) {
          this.links.push(elems);
          const index = this.links.length-1;
          for (const elem of elems) {
            elem.addEventListener('mouseenter', () => this.setAll(index, true), {signal: this.controller.signal});
            elem.addEventListener('mouseleave', () => this.setAll(index, false), {signal: this.controller.signal});
          };
        }
        
        linkFirst(first, rest) {
          if (!rest) rest = [];
          this.links.push([first, ...rest]);
          const index = this.links.length - 1;
          first.addEventListener('mouseenter', () => this.setAll(index, true), {signal: this.controller.signal});
          first.addEventListener('mouseleave', () => this.setAll(index, false), {signal: this.controller.signal});
          for (const elem of rest) {
            elem.addEventListener('mouseenter', () => this.setFirst(index, true), {signal: this.controller.signal});
            elem.addEventListener('mouseleave', () => this.setFirst(index, false), {signal: this.controller.signal});
          }
        }
        
        setAll(index, bool) {
          for (const elem of this.links[index]) {
            elem.classList.toggle('isHovering', bool);
          };
        }
        
        setFirst(index, bool) {
          this.links[index][0].classList.toggle('isHovering', bool);
        }
        
        abort() {
          for (let i = 0; i < this.links.length; i++) {
            this.setAll(i, false);
          }
          this.links.length = 0;
          this.controller.abort();
          this.controller = new AbortController();
        }
      }
      class Divider { // Line between two elements to click and drag
        constructor(elem1, elem2) {
          this.elem1 = elem1;
          this.elem2 = elem2;
          this.thickness = 12;
          this.divider = document.createElement('div');
          this.divider.className = 'divider';
          this.elem1.after(this.divider);
          this.mediaQuery = window.matchMedia('(orientation: portrait)');
          this.mediaQuery.addEventListener('change', () => this.reset());
          this.divider.addEventListener('dblclick', () => this.reset());
          this.divider.addEventListener('pointerdown', e => {
            const controller = new AbortController();
            window.addEventListener('pointermove', e => this.onDrag(e), {signal: controller.signal});
            window.addEventListener('pointerup', e => controller.abort(), {signal: controller.signal});
          })
          this.updateBoxes();
        }
        
        updateBoxes() {
          this.prect = this.elem1.parentElement.getBoundingClientRect();
          this.rect1 = this.elem1.getBoundingClientRect();
          this.rect2 = this.elem2.getBoundingClientRect();
          this.orientation = (this.rect1.right === this.rect2.left) ? 'vertical' : 'horizontal';
          if (this.orientation === 'vertical') {
            this.divider.style.width = `${this.thickness}px`;
            this.divider.style.cursor = 'ew-resize';
            this.divider.style.height = '100%';
            this.divider.style.top = '0';
            const pixels = this.rect1.right - this.thickness / 2
            this.divider.style.left = `${100*pixels/this.prect.width}%`;
          } else {
            this.divider.style.width = '100%';
            this.divider.style.height = `${this.thickness}px`;
            this.divider.style.cursor = 'ns-resize';
            this.divider.style.left = '0';
            const pixels = this.rect1.bottom - this.thickness / 2;
            this.divider.style.top = `${100*pixels/this.prect.height}%`;
          }
        }
        
        reset() {
          this.elem1.style.removeProperty('width');
          this.elem1.style.removeProperty('height');
          this.elem2.style.removeProperty('width');
          this.elem2.style.removeProperty('height');
          this.updateBoxes();
        }
        
        onDrag(e) {
          if (this.orientation === 'vertical') {
            const w1 = e.clientX - this.rect1.left;
            const w2 = this.rect2.right - e.clientX;
            this.elem1.style.width = `${clamp(100*w1/this.prect.width, 0, 100)}%`;
            this.elem2.style.width = `${clamp(100*w2/this.prect.width, 0, 100)}%`;
          } else if (this.orientation === 'horizontal') {
            const h1 = e.clientY - this.rect1.top;
            const h2 = this.rect2.bottom - e.clientY;
            this.elem1.style.height = `${clamp(100*h1/this.prect.height, 0, 100)}%`;
            this.elem2.style.height = `${clamp(100*h2/this.prect.height, 0, 100)}%`;
          }
          this.updateBoxes();
        }
      }
      
      // Main Script
      
      const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const palette = ['pink', 'skyblue', 'goldenrod', 'lightgreen', 'tan', 'khaki', 'mediumpurple', 'lightseagreen', 'violet', 'sandybrown'];
      const mainURL = 'https://docs.google.com/spreadsheets/d/1G4BoG5Jumb-N_HVgcvb5e1noY3rL4GG_F5kfpcgIl6s';
      const copyURL = 'https://docs.google.com/spreadsheets/d/19uhGgs5xKik_mL88TwFOr6L9ymopRCFCzgQ8Rk4OLPg';
      const gidMap = {events: 0, weekly: 1592630584, colors: 1588629629}
      
      const displayWindow = new DisplayWindow(document.getElementById('display-window'));
      const displayIcons = document.getElementById('display-icons');
      const modeButtons = document.querySelector('#window-banner .radio-buttons');
      const title = document.querySelector('#window-banner .title-text');
      const todayButton = document.querySelector('#window-banner .button');
      const windows = [
        new DayWindow(document.getElementById('day-window')),
        new MonthWindow(document.getElementById('month-window')),
        new YearWindow(document.getElementById('year-window'), 6),
      ];
      const divider = new Divider(
        document.getElementById('section-1'),
        document.getElementById('section-2'),
      );
      const hoverLinker = new HoverLinker();
      const categoryData = parseCategoryPage(localStorage.getItem('categoryData') || '');
      const eventData = parseDataPage(localStorage.getItem('eventData') || '');
      addWeeklyData(eventData, parseWeekPage(localStorage.getItem('weekData') || ''));
      
      let currentTab = Number(localStorage.getItem('currentTab') || 2);
      const sessionDate = sessionStorage.getItem('currentDate');
      windows[0].date = sessionDate ? new Date(sessionDate) : new Date();
      syncDates();
      selectTab(currentTab);
      fetchData(mainURL, gidMap);
      
      for (const [i, m] of [...modeButtons.children].entries()) {
        m.addEventListener('pointerdown', e => selectTab(getElemIndex(e.target)));
      }
      windows[2].elem.addEventListener('click', event => {
        const elem = event.target;
        const day = windows[2].getFirstDay();
        if (elem.classList.contains('date')) {
          addTime(day, 'month', getElemIndex(elem, 3));
          addTime(day, 'day', -day.getDay());
          addTime(day, 'day', getElemIndex(elem, 1) - 7);
          windows[0].date.setTime(day.getTime());
          selectTab(0);
          syncDates();
        } else if (elem.classList.contains('banner') || elem.classList.contains('day-name')) {
          addTime(day, 'month', getElemIndex(elem, 2))
          windows[1].date.setTime(day.getTime());
          selectTab(1);
          syncDates();
        }
      });
      windows[1].elem.addEventListener('click', event => {
        const elem = event.target;
        const date = startOfWeek(startOfMonth(windows[1].date));
        if (elem.parentElement.classList.contains('box')) {
          addTime(date, 'day', getElemIndex(elem, 2));
          windows[0].date.setTime(date.getTime());
          selectTab(0);
          syncDates();
        }
      })
    </script>
